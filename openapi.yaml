openapi: 3.1.0

info:
  title: webtrees Member Portal API
  version: 1.0.0-phase1
  description: |
    Read-only JSON API served by the webtrees custom module `portal_api`
    (`modules_v4/portal_api/`). It is consumed by the React member portal,
    which is deployed to Cloudflare Workers and proxies `/api/*` onto this API
    so that both live on the same origin.

    ## Authentication

    Cookie-session authentication, reusing webtrees' own session and user
    accounts. `POST /session` verifies the credentials through webtrees'
    authentication path and starts a webtrees session; the browser receives
    the standard webtrees session cookie
    (`__Secure-WT-ID` over HTTPS, `WT2_SESSION` otherwise) with
    `HttpOnly; Secure; SameSite=Lax; Path=/`.

    There is no bearer token. Nothing credential-shaped is readable from
    JavaScript.

    ## CSRF

    Every request whose method is not `GET`, `HEAD` or `OPTIONS` must carry
    the header `X-CSRF-TOKEN`, holding the token from `GET /csrf`. The token
    is webtrees' own session CSRF token (`Session::getCsrfToken()`).

    `SameSite=Lax` alone is not treated as sufficient.

    Note that webtrees core runs its own CSRF middleware in front of every
    `POST` route in the application, and it answers a bad token with a `302`
    redirect rather than a JSON error. Clients should therefore treat a
    redirect or a non-JSON response to an unsafe request as "token stale",
    re-fetch `GET /csrf` and retry once. All other methods are handled by this
    module and answer with `403 csrf_token_invalid`.

    ## Language

    Parts of a response are rendered by webtrees rather than by the client:
    `Event.label` (the name of a GEDCOM fact), `DateValue.display` (a date
    written out for a reader) and the placeholders that stand in for a name
    that may not be shown. Those follow the request's `Accept-Language`
    header, matched against the languages the webtrees installation has
    enabled — exactly, then by language without region, so `en` finds `en-US`.

    A request with no `Accept-Language`, or one asking only for languages that
    are not installed, is answered in whatever language webtrees would have
    chosen for it; nothing fails. `POST /session` is the one exception worth
    knowing about: with no header, it answers in the language set on the
    member's webtrees account.

    Responses carry `Vary: Cookie, Accept-Language`. Only `display` moves —
    `DateValue.gedcom` and `Event.tag` are machine-readable and stay put.

    ## Caching

    Every response carries `Cache-Control: private, no-store`. The Cloudflare
    Worker that proxies `/api/*` must also be configured to bypass the
    cache. A cached authenticated response would show one member another
    member's relatives.

    ## Privacy

    Every genealogy record in every response has passed webtrees' own
    visibility logic (`GedcomRecord::canShow()` and per-fact `Fact::canShow()`)
    at the authenticated user's access level for the configured tree. An
    individual the caller may not see is absent from the response entirely —
    including from nested relative lists and from directory entries — rather
    than being present in a redacted form, so that response shape does not leak
    existence.

servers:
  - url: /api/v1
    description: Same-origin path, via the portal's Cloudflare Worker
  - url: https://webtrees.example.org/api/v1
    description: The webtrees host directly (local development)

tags:
  - name: session
    description: Login, logout and CSRF
  - name: me
    description: The authenticated member
  - name: individuals
    description: Genealogy records
  - name: members
    description: Member directory
  - name: tree
    description: Searching and browsing the family tree

paths:
  /csrf:
    get:
      tags: [session]
      summary: Get a CSRF token
      description: |
        Returns the CSRF token for the current session, creating a session
        (and therefore setting the session cookie) if there is not one yet.
        Safe to call unauthenticated — this is how the login screen obtains a
        token.
      security: []
      operationId: getCsrfToken
      responses:
        '200':
          description: The current session's CSRF token
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsrfToken'

  /session:
    post:
      tags: [session]
      summary: Log in
      description: |
        Verifies username (or email) and password through webtrees'
        `UserService`/`User::checkPassword()` and starts a session.

        All failures — unknown user, wrong password, unverified email address,
        account not yet approved by an administrator, and rate limiting —
        return the same `401 invalid_credentials` body. The real reason is
        written to the webtrees authentication log server-side only. Requests
        that exceed the rate limit also return `401 invalid_credentials`, so
        that the limiter cannot be used to probe for valid usernames.
      security: []
      operationId: createSession
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Credentials'
      responses:
        '200':
          description: Logged in
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            Set-Cookie:
              schema:
                type: string
              description: |
                `PORTAL_REMEMBER`, when `remember` was `true` and the
                administrator allows it. Cleared with an expiry in the past
                otherwise.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: |
            Authentication failed. Deliberately indistinguishable across
            wrong password, unknown user, unverified account, unapproved
            account and rate limiting.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: invalid_credentials
                message: Benutzername oder Passwort ist falsch.
        '403':
          $ref: '#/components/responses/Forbidden'

    delete:
      tags: [session]
      summary: Log out
      description: |
        Destroys the server-side session. Returns a fresh CSRF token, because
        destroying the session invalidates the old one.
      operationId: deleteSession
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '200':
          description: Logged out
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsrfToken'
        '403':
          $ref: '#/components/responses/Forbidden'

  /me:
    get:
      tags: [me]
      summary: The authenticated member and their own record
      operationId: getMe
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: The authenticated member
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /me/profile:
    patch:
      tags: [me]
      summary: Update the member's own portal settings
      description: |
        Portal-native data only — this endpoint never touches GEDCOM. Fields
        that are absent are left alone; `display_name_override` may be sent as
        `null` to clear it.

        Setting `visible_in_directory` to true records the moment of consent in
        `consent_recorded_at`. Setting it to false clears that timestamp:
        withdrawn consent should not leave a record saying consent was given.
      operationId: updateMyProfile
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemberProfileUpdate'
      responses:
        '200':
          description: The updated profile
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberProfile'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /me/individual:
    put:
      tags: [me]
      summary: Propose changes to the member's own record
      description: |
        Submits an edit to the member's *own* linked individual record. The
        target is never taken from the request — it is whichever record
        webtrees links to the authenticated account — so this endpoint cannot
        be pointed at anyone else.

        The change does not take effect. It is written to webtrees' pending
        changes queue exactly as an editor's own edit would be, with a `CHAN`
        entry naming the member, and waits for an editor to approve it in
        webtrees. The response is therefore `202`, and the `individual` it
        returns is still the *approved* version.

        Only the fields listed in `IndividualUpdate` can be changed. Every
        other fact on the record — including facts the member is not allowed
        to see — is preserved untouched.
      operationId: updateMyIndividual
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IndividualUpdate'
      responses:
        '202':
          description: |
            The change was queued for approval. Nothing has changed yet.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PendingIndividual'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: |
            The account is not linked to a record, or the record is locked
            against editing.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /password/request:
    post:
      tags: [session]
      summary: Ask for a password reset link
      description: |
        Always answers `202`, whether or not the address belongs to an
        account, and takes a similar amount of time either way. Anything else
        would turn this into a way to find out who has an account.

        Uses webtrees' own reset mechanism: a token in the user's
        `password-token` preference, valid for one hour, delivered by
        webtrees' mail configuration. The link in the email points at the
        portal, not at webtrees.
      security: []
      operationId: requestPasswordReset
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        '202':
          description: Accepted — said the same thing regardless of the outcome.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Accepted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'

  /password/reset:
    post:
      tags: [session]
      summary: Set a new password using a token from the email
      description: |
        A valid token signs the member in, as webtrees' own reset does, so the
        response is the same `Me` payload as `POST /session`.
      security: []
      operationId: resetPassword
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token, password]
              properties:
                token:
                  type: string
                  minLength: 1
                password:
                  type: string
                  format: password
                  minLength: 8
      responses:
        '200':
          description: The password was changed and the member is signed in.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '400':
          description: |
            The token is unknown or has expired, or the password is too short.
            The two are distinguishable: a token is not a secret worth
            protecting once it has expired, and a member who waited too long
            needs to be told so.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/Forbidden'

  /invitation/preview:
    post:
      tags: [session]
      summary: What does this invitation open?
      description: |
        A read, done with `POST`, on purpose. The token has to travel in the
        body: a `GET /invitation/{token}` would write the credential into the
        webserver's access log, into any proxy in front of it, and into the
        `Referer` of every request the resulting page makes.

        The answer is deliberately small — the family tree's title and the
        name the invitation was issued for. No XREF and no genealogy record:
        the reader is not signed in. The name is a snapshot stored on the
        invitation when it was issued, so nothing on this path reads the
        family tree.

        Unknown, expired, spent, withdrawn and rate-limited all produce the
        same `invalid_token`.
      security: []
      operationId: previewInvitation
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token]
              properties:
                token:
                  type: string
                  minLength: 1
      responses:
        '200':
          description: The invitation is still good.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationPreview'
        '400':
          description: The invitation cannot be used. One answer for every reason.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/Forbidden'

  /invitation/accept:
    post:
      tags: [session]
      summary: Turn an invitation into an account
      description: |
        Creates a plain webtrees user account — there is no second user store
        — already verified and already approved, with the role `member` on the
        portal's tree, linked to the individual the invitation named. It then
        signs the new member in, so the response is the same `Me` payload as
        `POST /session`.

        The invitation is claimed with a conditional update, so two requests
        arriving together cannot both produce an account. A refusal that
        creates nothing — a username somebody else has, a password that is too
        short — leaves the invitation usable.
      security: []
      operationId: acceptInvitation
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvitationAcceptance'
      responses:
        '201':
          description: The account exists and the member is signed in.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '400':
          description: |
            The invitation cannot be used, or the account details are not
            acceptable — a password shorter than eight characters, a username
            outside 3–32 characters or containing a space or `@`, or an
            address that is not an address.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: |
            The username or the email address already belongs to an account.
            `username_taken` or `email_taken`. These do say something about
            the installation, which is unavoidable in a form somebody has to
            be able to complete; they are reachable only while holding a valid
            invitation.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /health:
    get:
      tags: [session]
      summary: Is the chain working?
      description: |
        Answering this at all takes a request through the Cloudflare Worker,
        its proxy secret, whatever URL form webtrees needs, PHP, webtrees'
        bootstrap, this module's `boot()`, the database and the tree
        configuration. One request either proves all of that or reports the
        first thing that is wrong.

        Unauthenticated on purpose — a health check that needs credentials is
        a health check nobody runs. The payload is deliberately dull: no tree
        name, no counts, nothing that would make the endpoint worth finding.

        `version` is the one thing it does disclose, and it is what turns "the
        upload reported success" into "the new code is actually running".
      security: []
      operationId: health
      responses:
        '200':
          description: Everything the portal needs is in place.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          description: |
            The module is running but cannot serve a family tree. Deliberately
            *not* recorded in the module's error log: an uptime monitor
            polling a half-configured installation would otherwise fill it.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /invitations:
    get:
      tags: [invitations]
      summary: Whom may I invite, and whom have I invited?
      description: |
        Everything the member's invite screen needs in one request.

        The candidate list is the same walk the member's own page already
        does, at the same access level, stopping at the limit the family set —
        so opening this screen discloses nobody new. Relatives who are dead,
        who already hold an account, or who already have an invitation
        outstanding are absent, and nothing says which of the three applies:
        "your brother already has an account" would route around the consent
        model the member directory rests on.

        Answers rather than refuses when the facility is switched off, so the
        screen can say so.
      operationId: listInvitations
      responses:
        '200':
          description: The member's invitation state.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationOverview'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

    post:
      tags: [invitations]
      summary: Invite one close relative
      description: |
        Every rule is re-checked here rather than trusted from the list that
        offered it: a client can post any XREF it likes. Too distant, hidden,
        already an account holder, already invited and not a person at all all
        produce the same `not_allowed`, so posting an XREF is not a way to
        find out which.

        The link is in the response once. Only a hash of the token is stored,
        so it cannot be recovered afterwards — losing it means withdrawing the
        invitation and issuing another.
      operationId: createInvitation
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [xref]
              properties:
                xref:
                  type: string
                  description: One of the XREFs from `GET /invitations`.
                email:
                  type: string
                  description: |
                    Optional. Noted on the invitation and prefilled on the
                    invitee's form. The module does not send it.
      responses:
        '201':
          description: The invitation exists. The link is here and nowhere else.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssuedInvitation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: |
            `not_allowed` — members may not invite in this tree, or may not
            invite this person. `no_linked_record` — the account is not linked
            to anybody in the family tree, so it has no family to invite.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: '`quota_reached` — too many outstanding already.'
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: The portal has no address configured, so no link can be built.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /invitations/{id}:
    delete:
      tags: [invitations]
      summary: Withdraw an invitation I sent
      description: |
        Somebody else's invitation and one that has already been used are both
        `404`. A member has no business learning which.
      operationId: withdrawInvitation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '200':
          description: Withdrawn. The body is the refreshed overview.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationOverview'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /me/connection-link:
    post:
      tags: [members]
      summary: A link to send to somebody who is not in the room
      description: |
        The same handshake as the code on the screen — whoever follows it and
        taps is connected, with no confirmation asked — with the two
        differences that a week in somebody else's inbox makes: it lasts
        `LINK_DAYS` (seven) rather than minutes, and **it works once**. A link
        that has been forwarded, quoted in a reply or left in an old chat is a
        link that has already been spent.

        The link is in this response and nowhere else; the module stores only
        a hash. Losing it means withdrawing it and making another. A member
        may have a handful outstanding at a time, one per person written to.

        Needs the module's portal address, because the link is a link into the
        portal.
      operationId: createConnectionLink
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '201':
          description: The link to send, and when it stops working.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectionLink'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: |
            `quota_reached` — as many unused links outstanding as one member
            may have at once.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: '`not_configured` — the module has no portal address.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /me/connection-links/{id}:
    delete:
      tags: [members]
      summary: Take back a link nobody has used
      description: |
        For the message sent to the wrong address. The row is deleted rather
        than marked spent, so nothing is left that could be redeemed.

        Somebody else's link, and one already used, are both `404`: a member
        has no business learning which, and a link that was used is no longer
        a link — it is a connection, ended with
        `DELETE /connections/{id}`.
      operationId: revokeConnectionLink
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: The member's lists as they now stand.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectionOverview'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /me/contact:
    get:
      tags: [members]
      summary: What am I sharing, and with whom?
      description: |
        The member's own entries, audience and all. Only ever their own — you
        can always see what you have chosen to share, so this is the one place
        that ignores the audience.

        Nothing here comes from the family tree. `ADDR`, `EMAIL`, `PHON` and
        `WWW` are still withheld on everybody's record but their own: GEDCOM
        contact data is maintained by whoever keeps the tree, and nobody can
        consent to "whatever my record happens to say".
      operationId: readContact
      responses:
        '200':
          description: The member's own entries.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactSettings'
        '401':
          $ref: '#/components/responses/Unauthorized'

    patch:
      tags: [members]
      summary: Change what I share
      description: |
        A kind absent from the body is left alone. A kind that arrives with an
        **empty value is deleted**, and that is the only thing that deletes
        one: clearing the field is the withdrawal, so nothing is left behind
        to leak later.

        `nobody` **keeps** the entry and discloses it to no one. An address
        shared with no relative is still the address the family magazine is
        posted to — an audience of nobody and no entry at all are the same
        thing for disclosure and not for the family. Clients are expected to
        say so where the choice is made.

        Unknown kinds and unknown audiences are ignored, and an unrecognised
        audience resolves to `nobody`.
      operationId: updateContact
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [contact]
              properties:
                contact:
                  $ref: '#/components/schemas/OwnContact'
      responses:
        '200':
          description: The entries as they now stand.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactSettings'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /me/mailing-lists:
    get:
      tags: [members]
      summary: Which of the family's letters do I get?
      description: |
        The lists an administrator has named, and this member's answer to each
        one. Only ever their own.

        **The addresses are not in the payload.** A list is identified by an
        opaque key — the SHA-256 of its address — so that offering a member a
        subscription does not put the family's distribution addresses into
        every browser. What a member is shown is the name and the sentence the
        administrator wrote.

        The lists live in Exchange Online and this portal holds only the wish,
        so `state` says whether the two agree yet. Reading this endpoint is
        also when an outstanding change is tried again — there is no scheduled
        job in a webtrees installation to hang one on, and a member opening
        this screen is the person who most wants it to have gone through. It is
        bounded, so an Exchange outage is never felt as a portal that will not
        open.
      operationId: readMailingLists
      responses:
        '200':
          description: The lists and this member's answers.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MailingLists'
        '401':
          $ref: '#/components/responses/Unauthorized'

    patch:
      tags: [members]
      summary: Join a list, or leave one
      description: |
        A list absent from the body is left alone, which is what makes this a
        PATCH: the screen sends the one switch that moved.

        The decision is recorded before Exchange is told about it, and the
        answer comes back either way — a `pending` state is not a failure, it
        is the portal saying it has the answer and is passing it on. A key that
        names no configured list is a `400`.

        Only about the signed-in member. There is no way in this API to
        subscribe anybody else: putting an address on a family mailing list is
        a decision that belongs to whoever reads that address.
      operationId: updateMailingLists
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [lists]
              properties:
                lists:
                  type: object
                  minProperties: 1
                  additionalProperties:
                    type: boolean
                  description: |
                    Keyed by the `key` of a list, `true` to join and `false` to
                    leave.
      responses:
        '200':
          description: The lists as they now stand.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MailingLists'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /members/{id}/message:
    post:
      tags: [members]
      summary: Write to another member
      description: |
        Delivered by webtrees' own `MessageService`, so the recipient is
        reached the way they chose in webtrees — internal message, email, or
        both. The portal never learns their address.

        **The sender's address does travel**, as the reply address, because
        there is no way to allow a reply without it. The portal says so on the
        form before the message is sent.

        Only a member listed in the directory can be written to. One who kept
        themselves out is reported as `404`, the same answer as an id that
        never existed.
      operationId: sendMessage
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: A portal member id, not a webtrees user id.
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [subject, body]
              properties:
                subject:
                  type: string
                  minLength: 1
                  maxLength: 128
                body:
                  type: string
                  minLength: 1
                  maxLength: 4000
      responses:
        '202':
          description: Handed to webtrees for delivery.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Accepted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: '`not_allowed` — members may not write to each other in this tree.'
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: '`quota_reached` — as many messages as may be sent today.'
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: '`not_delivered` — webtrees could not deliver it.'
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /messages:
    get:
      tags: [members]
      summary: My own messages
      description: |
        Everything addressed to this member, newest first — not only what the
        portal sent. webtrees' own contact forms and an administrator's
        broadcast deliver to the same table, and a member should not have to
        know which route a message took.

        Two things are done to each row on the way out. `message.body` is not
        the message: it is webtrees' rendered `emails/message-user-text` view,
        with a greeting, a line naming the sender, a rule, the message,
        another rule and a note about the URL. Only the part between the rules
        is returned — and a body with no rules is returned whole, because
        losing the wrapper is a nicety and losing the message would be a bug.

        `message.sender` is an email address, not an account, so the name is
        looked up. When the lookup fails — a changed address, a deleted
        account, a visitor using a contact form — the address itself is
        returned. That discloses nothing new: it was already the reply address
        on the email.
      operationId: listMessages
      responses:
        '200':
          description: The member's messages and how many are unread.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Inbox'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /messages/{id}:
    patch:
      tags: [members]
      summary: Mark a message read, or unread again
      description: |
        Idempotent. Somebody else's message and one that does not exist are
        both `404`.
      operationId: updateMessage
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [read]
              properties:
                read:
                  type: boolean
      responses:
        '200':
          description: The inbox as it now stands.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Inbox'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags: [members]
      summary: Delete one of my messages
      description: |
        Really deleted, from webtrees' own table — an inbox nobody can clear
        is a nuisance rather than a feature. The read state follows through a
        foreign key.
      operationId: deleteMessage
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '200':
          description: The inbox as it now stands.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Inbox'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /messages/{id}/reply:
    post:
      tags: [members]
      summary: Answer a message in my own inbox
      description: |
        The directory rule that governs `POST /members/{id}/message` does not
        apply here, deliberately. That rule exists because picking somebody out
        of a directory is *finding* them; a reply finds nobody, because the
        other person wrote first. A member who stayed out of the directory can
        therefore be answered — but still not approached.

        There is no `subject`: the reply carries webtrees' `RE: ` convention
        applied to the original, decided on the server.

        As with any message, the sender's own address travels with it as the
        reply address. The portal says so on the form.
      operationId: replyToMessage
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [body]
              properties:
                body:
                  type: string
                  maxLength: 4000
      responses:
        '202':
          description: Handed to webtrees for delivery.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [sent]
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: '`not_allowed` — messages are switched off for this tree.'
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            `cannot_reply` — the address on the message belongs to no account,
            so there is nobody for webtrees to deliver an answer to. Or
            `quota_reached` — as many messages as may be sent today.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: '`not_delivered` — webtrees could not deliver it.'
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /photos:
    post:
      tags: [members]
      summary: Add a photograph of myself
      description: |
        **The member's own record and no other.** There is no id in this
        request and there is not going to be one: a photograph is permission,
        and nobody can give permission on somebody else's behalf.

        The reason this endpoint exists is the rule it serves. A photograph of
        a *living* person is shown in the portal only where that person
        uploaded it themselves — what the family tree happens to hold about
        somebody is not something they consented to publish, and a face is the
        least deniable thing on a record. Photographs of the dead are
        untouched: the family archive is what a portal like this is for.

        **The file is re-encoded rather than stored.** What comes off a phone
        carries EXIF, and EXIF carries where the picture was taken. Decoding
        the pixels and writing a fresh JPEG drops every tag there is, which is
        more complete than deleting the ones anybody has heard of — and it
        settles the "is this really an image" question at the same time. JPEG,
        PNG and WebP go in; a JPEG of at most 1600px on its long edge comes
        out.

        The photograph is live at once, which is deliberate and unlike every
        other change a member may make to their record: a name is a claim about
        a person and waits for the family's approval, a photograph is
        permission *from* one. The single exception is a record that already
        has an unapproved edit waiting — a pending change in webtrees is a
        snapshot of the whole record, so accepting the photograph would accept
        that edit too. There the photograph waits with it and `pending` says so.
      operationId: createPhoto
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [photo]
              properties:
                photo:
                  type: string
                  format: binary
                  description: JPEG, PNG or WebP, at most 4 MB.
      responses:
        '201':
          description: The photograph is on the record.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required: [photos, pending]
                properties:
                  photos:
                    type: array
                    items:
                      $ref: '#/components/schemas/Photo'
                  pending:
                    type: boolean
                    description: |
                      True where an unapproved edit was already waiting on this
                      record, so the photograph waits with it.
        '400':
          description: |
            Not an image, larger than 4 MB, or no file in the request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: '`no_linked_record` — the account is not linked to anybody in the tree.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /photos/{xref}:
    delete:
      tags: [members]
      summary: Take my photograph down again
      description: |
        The half that makes the rest of it honest: a permission that cannot be
        withdrawn is not a permission.

        Only the member who uploaded it. Somebody else's photograph is reported
        as not found rather than refused, as everywhere else in this API, so an
        xref is never a way to discover what exists.

        The media record and its link go with it. This is the one place the
        portal deletes from the family's tree, and it is right that it does:
        the record exists only because a member gave permission.
      operationId: deletePhoto
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/CsrfHeader'
        - name: xref
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: What is left on the record.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required: [photos]
                properties:
                  photos:
                    type: array
                    items:
                      $ref: '#/components/schemas/Photo'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Not this member's photograph, or no such photograph.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /push:
    get:
      tags: [members]
      summary: Whether this portal can send notifications
      description: |
        Three things have to hold before a member can be offered this: the
        family has not switched notifications off, the module holds a VAPID key
        pair, and the portal knows its own address — VAPID requires a contact
        for whoever runs the sender, and this portal's is its URL.

        `public_key` is public by design: it is what a browser needs in order
        to subscribe, and it identifies the sender rather than authorising
        anything. `subscribed` is about the *account* across devices; whether
        this particular browser has a subscription is something only the
        browser knows, and the screen combines the two.
      operationId: readPush
      responses:
        '200':
          description: What is possible, and whether this account uses it.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PushState'
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      tags: [members]
      summary: Remember this device
      description: |
        **Only the endpoint is stored.** A browser also offers `p256dh` and
        `auth`, which exist to encrypt a payload — and this portal sends none.
        A push from here is a knock: the service worker shows a sentence it
        already knows, so a lock screen says that something arrived and never
        what or from whom. Storing keys for a capability nobody has decided to
        want would be storing material for a decision not yet taken.

        Idempotent by endpoint. A browser re-subscribes the same device on its
        own whenever its push service rotates the address, and that updates the
        row rather than adding one — including moving it to a different account
        when a shared device changes hands.
      operationId: subscribeToPush
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [endpoint]
              properties:
                endpoint:
                  type: string
                  format: uri
                  maxLength: 1000
                  description: Must be https. Anything else is refused rather than stored.
      responses:
        '201':
          description: The device is remembered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PushState'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: This family tree does not send notifications.

    delete:
      tags: [members]
      summary: Forget this device
      description: |
        Silent when there was nothing to forget: the member asked for it to be
        gone and it is gone. A subscription the browser has already discarded
        is also cleaned up server-side the first time it is knocked on, because
        the push service answers 404 or 410 for a device that is gone for good.
      operationId: unsubscribeFromPush
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [endpoint]
              properties:
                endpoint:
                  type: string
                  format: uri
      responses:
        '200':
          description: The device is forgotten.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PushState'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /conversations:
    get:
      tags: [members]
      summary: My conversations
      description: |
        The exchanges the portal keeps a transcript of, newest first.

        Not the same list as `/messages`, and deliberately not merged with it.
        That one is webtrees' inbox: everything addressed to this member from
        anywhere, including its own contact form and an administrator's
        broadcast. This one is the portal's own store, and it exists because
        webtrees' table cannot hold a conversation — it keeps one row per
        message, owned by the recipient, so the half a member wrote themselves
        was never written down anywhere.

        A conversation whose messages this member has deleted is absent, not
        empty. It is not deleted for the other side, and a new message brings
        it back.
      operationId: listConversations
      responses:
        '200':
          description: Every conversation with something in it.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [conversations]
                properties:
                  conversations:
                    type: array
                    items:
                      $ref: '#/components/schemas/Conversation'
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      tags: [members]
      summary: Open the conversation with a member
      description: |
        Idempotent: asking twice returns the one conversation the pair has.

        This is the step the directory rule guards, because opening a
        conversation is *finding* somebody. The rule is the one `POST
        /members/{id}/message` already applies — listed in the directory, or
        connected to me — and a member who is neither is reported as **404**,
        exactly as a member id that never existed. Writing *into* a
        conversation afterwards asks a different question and is not guarded
        this way: the transcript is proof the two know each other.
      operationId: openConversation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [member_id]
              properties:
                member_id:
                  type: integer
                  description: A portal member id, not a webtrees user id.
      responses:
        '200':
          description: The conversation, new or already there.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [conversation]
                properties:
                  conversation:
                    $ref: '#/components/schemas/Conversation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Members cannot write to each other in this family tree.
        '404':
          $ref: '#/components/responses/NotFound'

  /conversations/{id}:
    get:
      tags: [members]
      summary: Read a conversation
      description: |
        Reading marks the other side's messages read — that is what opening a
        conversation means, and the alternative is a second deliberate act
        whose only purpose is to make a badge go away.

        Somebody else's conversation and one that never existed give the same
        **404**.
      operationId: readConversation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: before
          in: query
          required: false
          schema:
            type: integer
          description: |
            Ask for the page before this message id. Absent means the newest
            page. `before` in the response is the id to send next, or null when
            the beginning has been reached.
      responses:
        '200':
          description: The transcript, oldest message first.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transcript'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags: [members]
      summary: Clear a conversation, for me
      description: |
        Hides every message this member can currently see. The other side
        keeps theirs, and a new message brings the conversation back — that is
        the only meaning "delete for me" can honestly have when two people
        share a transcript. A message both sides have hidden is removed from
        the database outright.
      operationId: clearConversation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: The remaining conversations.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [conversations]
                properties:
                  conversations:
                    type: array
                    items:
                      $ref: '#/components/schemas/Conversation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /conversations/{id}/messages:
    post:
      tags: [members]
      summary: Say something
      description: |
        No subject: a conversation is one thread with one other person.

        Counted against the same daily limit as `POST /members/{id}/message` —
        a message is a message, and the limit is about volume.

        The other side is told by e-mail only when they have nothing unread
        from this member already. A chat that sends an e-mail per line is a
        chat nobody stays in; once something is waiting, they have been told.
      operationId: postConversationMessage
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [body]
              properties:
                body:
                  type: string
                  maxLength: 4000
      responses:
        '201':
          description: The message, as it now stands in the transcript.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [message]
                properties:
                  message:
                    $ref: '#/components/schemas/ConversationMessage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Members cannot write to each other in this family tree.
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The daily limit for this member has been reached.

  /conversations/{id}/messages/{message}:
    delete:
      tags: [members]
      summary: Delete one message, for me
      description: |
        The other side keeps their copy. A message once read cannot be unsaid,
        and a portal that let one member reach into another's transcript would
        be promising something it cannot deliver.
      operationId: deleteConversationMessage
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: message
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: The refreshed transcript.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transcript'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /connections:
    get:
      tags: [members]
      summary: Whom do I know, and who is waiting for an answer?
      description: |
        The member's own contacts, the requests made to them, and the requests
        they made. Nothing about anybody else's.

        Answers even when the family has switched connections off, with
        `enabled: false` and the lists as they stand — a member must be able
        to see what they agreed to, and end it, whatever an administrator has
        done since.
      operationId: listConnections
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: My contacts, and the requests either way.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectionOverview'
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      tags: [members]
      summary: Connect with another member
      description: |
        Exactly one of `code`, `reference` or `member_id`, and they are not
        the same thing:

        * **`code`** is a connection code scanned off the other member's
          screen. It connects both of them at once — showing the code is the
          consent, and asking somebody to confirm what they are doing in front
          of you teaches people to tap "yes" without reading. It is a
          credential, so it travels in the body rather than in a path a
          webserver log, a proxy or a `Referer` header would keep.
        * **`reference`** is the reference number printed on the other
          person's record ("SB 4711"). It only *asks*; the other member
          answers with `PATCH /connections/{id}`. Only members listed in the
          directory can be found this way, and only numbers on a record the
          asking member may see — a `RESN` under a `REFN` hides it.
        * **`member_id`** is the same request, from the other member's page in
          the directory, where there is nothing to mistype.

        A request that crosses one coming the other way is treated as the
        answer to it: both people have asked, and there is nothing left to
        confirm.
      operationId: createConnection
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                code:
                  type: string
                  description: A connection code, as scanned.
                reference:
                  type: string
                  maxLength: 40
                  description: |
                    A reference number as a member would type it. "SB 4711",
                    "sb4711" and "4711" are the same number: whitespace and the
                    separators inside a number (`.`, `,`, `-`) are ignored, and
                    the family's spoken prefix may be left off.

                    Everything else is part of the number — including letters
                    and a marker on the end, where `!` means the spouse of the
                    person carrying the same number without it. The slash may
                    be left out, but only where that still picks out exactly
                    one member.
                member_id:
                  type: integer
                  minimum: 1
                  description: A portal member id, from the directory.
      responses:
        '201':
          description: |
            The result, and the member's lists as they now stand. `status` is
            `connected` when the two are now in touch, `requested` when the
            other member still has to answer, and `already_connected` when the
            number belongs to somebody this member is already connected with —
            in which case nothing was written.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectionResult'
        '400':
          description: |
            More or fewer than one of the three, an expired or unknown code
            (`invalid_token`), or one's own code or reference number.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: |
            The family has switched connections off (`not_allowed`), or the
            CSRF token was missing or stale.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: |
            No member of the directory carries that reference number, or no
            such member id. One answer for "no such number", "not listed" and
            "you may not see that record".
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: |
            `quota_reached` — as many unanswered requests as one member may
            have at once. A code is not a request and is not counted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /connections/{id}:
    patch:
      tags: [members]
      summary: Say yes to a request
      description: |
        The only change a member can make to a connection. Accepting one that
        was not made to them, or one already answered, is `404` — the same
        answer as an id that never existed.
      operationId: acceptConnection
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [status]
              properties:
                status:
                  type: string
                  enum: [accepted]
      responses:
        '200':
          description: The lists as they now stand.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectionResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags: [members]
      summary: Decline it, withdraw it, or end it
      description: |
        One verb for the three, because they are one act: this row should not
        exist any more. It works from either end, and it works when the family
        has switched connections off — a member must always be able to undo
        this. Nothing is kept, so nobody can later read off who refused whom.
      operationId: removeConnection
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: The lists as they now stand.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectionOverview'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /me/connection-code:
    post:
      tags: [members]
      summary: A code to hold up at the family gathering
      description: |
        Issues a code and returns the link to put in a QR code. A `POST`, and
        deliberately not idempotent: each call replaces the one before it, so
        the code on the screen is the only one that works.

        The code itself is in this response and nowhere else — the module
        stores only a hash, exactly as it does for an invitation. It expires
        after the number of minutes an administrator set (a quarter of an hour
        by default), and anybody who can see it can connect until it does.

        Needs the module's portal address setting, because the code is a link
        into the portal. Without it the request is refused rather than
        answered with a code nobody can scan.
      operationId: createConnectionCode
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '201':
          description: The link to show, and when it stops working.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectionCode'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          description: |
            `not_configured` — the module has no portal address, so no link
            can be built.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    delete:
      tags: [members]
      summary: Stop the code working now
      description: |
        For "put it away", and for somebody having photographed the screen.
        Succeeds whether or not a code was outstanding.
      operationId: revokeConnectionCode
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '200':
          description: There is no code any more.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [revoked]
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /individuals/{xref}:
    get:
      tags: [individuals]
      summary: One individual record, privacy-filtered
      description: |
        Returns `404` both when the record does not exist and when the
        authenticated user may not see it, so that the response does not
        disclose which of the two is the case.
      operationId: getIndividual
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - name: xref
          in: path
          required: true
          description: The GEDCOM XREF of the individual, e.g. `X1234`.
          schema:
            type: string
            pattern: '^[A-Za-z0-9_.\-]{1,20}$'
      responses:
        '200':
          description: The individual
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Individual'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /individuals/{xref}/ancestors:
    get:
      tags: [Tree]
      summary: A person's ancestors, several generations at once
      description: |
        The pedigree above one person, flat, in Ahnentafel numbering: the root
        is 1, a father is 2n and a mother is 2n+1. The client indexes by
        `position` and never walks a nested structure.

        Nothing here is visible that stepping from relative to relative would
        not also reach. The walk runs at the member's access level and **stops**
        at anyone they may not see: that person is absent, and so is everyone
        above them. There is no placeholder and no gap to read meaning into —
        the branch simply ends, exactly as it does on the profile screen.

        This exists so that four generations are one request rather than
        fifteen, which matters on a phone and on shared hosting.
      operationId: getAncestors
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - name: xref
          in: path
          required: true
          description: The record to start from.
          schema:
            type: string
        - name: generations
          in: query
          required: false
          description: |
            How many generations above the root to include. Clamped to 1..6
            rather than refused; the response says what was used.
          schema:
            type: integer
            minimum: 1
            maximum: 6
            default: 4
      responses:
        '200':
          description: The visible ancestors.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AncestorPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /media/{xref}/{fact}/{size}:
    get:
      tags: [Tree]
      summary: The bytes of a photograph
      description: |
        A picture, served from the portal's own origin so that the request
        carries the member's session.

        webtrees' own media URLs point at the webtrees host, and the session
        cookie is deliberately scoped to the portal's origin — a browser
        following one would arrive with no session, fail `canShow()`, and get
        webtrees' "forbidden" replacement image. So the URLs in `Photo` are
        these, and the bytes make one extra hop.

        The rendering is webtrees': its image factory produces the thumbnail
        and applies whatever watermark it would apply on its own pages for this
        user. What is decided here is only whether this member may see the
        picture, and for how long a browser may keep it.

        **The one response in this API that is not `no-store`.** It is
        `private, max-age=86400`: a browser may keep it, a shared cache may
        not. A gallery re-fetched on every scroll costs a phone its battery for
        no reason; `public`, which is what webtrees itself sends, would let a
        CDN edge hand one member's photograph to the next member who asks.
      operationId: getMedia
      parameters:
        - name: xref
          in: path
          required: true
          description: The media record.
          schema:
            type: string
        - name: fact
          in: path
          required: true
          description: Which file within that record — `Photo.id`.
          schema:
            type: string
            pattern: '^[0-9a-f]{32}$'
        - name: size
          in: path
          required: true
          schema:
            type: string
            enum: [thumbnail, image]
      responses:
        '200':
          description: The image.
          headers:
            Cache-Control:
              schema:
                type: string
                example: private, max-age=86400
          content:
            image/*:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /members:
    get:
      tags: [members]
      summary: Directory of members who opted in
      description: |
        Lists webtrees users who have a portal profile with
        `visible_in_directory` set. A member's own entry is included.

        The `display_name` of an entry is portal data the member consented to
        publish, not GEDCOM data. The `individual` of an entry is GEDCOM data
        and is `null` whenever the caller may not see that record.
      operationId: listMembers
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - name: q
          in: query
          required: false
          description: Case-insensitive substring filter on the display name.
          schema:
            type: string
            maxLength: 100
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: per_page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
      responses:
        '200':
          description: A page of members
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberPage'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /search:
    get:
      tags: [tree]
      summary: Look through the family tree
      description: |
        Three ways of asking, one shape of answer. `q` matches names and
        archive reference numbers at once — a member typing "1487" and a
        member typing "Bertha" are doing the same thing and should not have to
        say which. `surname` and `place` are the second half of the indexes at
        `/index`, and match exactly rather than by substring, because the
        member got here by tapping an entry that came out of one of them.

        The three are alternatives, not filters that combine: `surname` wins
        over `place`, which wins over `q`.

        `q` also matches nicknames written as a `2 NICK` subtag of the name.
        webtrees indexes only the inline spelling — `Bertha "Betty"
        /Beispiel/` — so in an archive that uses the subtag those names are in
        no index at all. Both are matched here, and the nickname is put back
        into the name that every shape returns.

        **A search discloses differently from tapping through a family, so it
        obeys a second rule.** On top of webtrees' own access level, which
        applies here exactly as it does everywhere else, a *living* person
        appears only if they are a portal member who is visible in the
        directory. Somebody dead appears whenever the access level allows it.
        A member who stayed out of the directory is still reachable by walking
        the tree from a relative — the search simply does not become a second,
        quieter way of enumerating the living.

        **Editors and above are exempt from that second rule** and see whatever
        their access level allows: they already have the whole tree in
        webtrees, so it would protect nobody. What it never does is widen — a
        record webtrees hides stays hidden for them too.
      operationId: searchTree
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - name: q
          in: query
          required: false
          description: A name, part of one, or an archive reference number.
          schema:
            type: string
            maxLength: 100
        - name: surname
          in: query
          required: false
          description: An exact surname, as listed by `/index`.
          schema:
            type: string
            maxLength: 100
        - name: place
          in: query
          required: false
          description: An exact place name, as listed by `/index`.
          schema:
            type: string
            maxLength: 100
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: per_page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
      responses:
        '200':
          description: A page of people
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchPage'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /relationship:
    get:
      tags: [tree]
      summary: How two archive numbers are related
      description: |
        The family's own calculator, which has existed as a page of its own
        since 2009, brought inside the portal.

        An SB number is not a label — it is a position in one descent. Expanded,
        it is the line's prefix followed by one character per generation saying
        which child. That makes the number a **complete ancestral path**, so the
        relationship between any two members of the family is a property of two
        strings: the longest common prefix is the nearest ancestor they share,
        and the two remaining lengths are the rest of the answer.

        Two things the tree cannot do follow from that. It reaches **any**
        distance — a fourth cousin twice removed is the same arithmetic as a
        brother — and it needs **no records at all**, so it answers about people
        who are not in the tree, or whose connecting relatives are not visible
        to the reader.

        **It therefore has no privacy rule of its own, because there is nothing
        to disclose.** Nobody is named, no record is read, and an unissued
        number is answered exactly like an issued one — so this cannot be used
        to find out whether a number belongs to anybody. Authentication is
        required because everything in this API requires it, and no further.

        Marriages between two people who both have a number are folded in
        first: the children of such a couple are filed under one parent's
        number only, and the table of those marriages is maintained in the
        module's preferences alongside the table of line prefixes.

        `GS/` needs no entry in either table — it stands for nothing, because
        the number after it is already the whole path. `GS/` on its own is the
        root of everything and names nobody.
      operationId: readRelationship
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - name: a
          in: query
          required: false
          description: |
            An archive number, written as the family writes it — dots, spaces
            and case are ignored, so `24/b521.12` and `24/B52112` are the same.

            A record that belongs to no line — an ancestor above them all, or a
            branch that was numbered and then died out — is written `GS/`
            followed by the path itself, already expanded. Those are read too,
            and `GS/7d3` names the same person as `24/`.

            The oblique is optional when nothing follows it: `24` and `24/` are
            both the head of line 24. `24b6` is not read, because a two-digit
            line makes it ambiguous.

            `GS` with nothing after it is the progenitor — the one person every
            number descends from, and the only way to write him.
          schema:
            type: string
            maxLength: 40
        - name: b
          in: query
          required: false
          description: The other one. The answer names *this* person.
          schema:
            type: string
            maxLength: 40
      responses:
        '200':
          description: |
            Always `200`, including when a number cannot be read — `problem`
            says what is wrong, so the screen can point at the field rather
            than report a failure.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RelationshipResult'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /index:
    get:
      tags: [tree]
      summary: The surnames and the places in the tree
      description: |
        For the member who has not got a question yet. A search answers one; an
        index is what makes an archive something you can look through rather
        than something you have to query.

        Both lists come from one pass over the records, which is why they are
        one endpoint. Both obey the same two rules as `/search`, so the counts
        are counts of people this member may find — never a total that hints
        at records they may not see.
      operationId: readIndex
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: The two indexes
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TreeIndex'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /members/{id}:
    get:
      tags: [members]
      summary: One member of the directory
      description: |
        Returns `404` for a member who is not visible in the directory, so
        that a non-listed account cannot be confirmed by probing.
      operationId: getMember
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - name: id
          in: path
          required: true
          description: |
            The portal member id — the surrogate primary key of
            `portal_member_profile`. Not a webtrees user id and not a GEDCOM
            XREF.
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: The member
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

components:

  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Secure-WT-ID
      description: |
        The webtrees session cookie, set by `POST /session`. Named
        `WT2_SESSION` when the site is not served over HTTPS.

  headers:
    CacheControl:
      description: Always `private, no-store`.
      required: true
      schema:
        type: string
        const: 'private, no-store'

  parameters:
    AcceptLanguage:
      name: Accept-Language
      in: header
      required: false
      description: |
        The language to render server-side strings in — fact labels, written
        dates, privacy placeholders. Standard content negotiation; an
        unavailable language is ignored rather than refused.
      example: de
      schema:
        type: string

    CsrfHeader:
      name: X-CSRF-TOKEN
      in: header
      required: true
      description: The token from `GET /csrf`.
      schema:
        type: string

  responses:
    BadRequest:
      description: The request body was malformed or a field was missing.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: bad_request
            message: Die Anfrage war unvollständig.

    Unauthorized:
      description: No valid session. The body carries no record data.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: unauthenticated
            message: Bitte melden Sie sich an.

    Forbidden:
      description: The CSRF token was missing or did not match the session.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: csrf_token_invalid
            message: Die Sitzung ist abgelaufen. Bitte erneut versuchen.

    NotFound:
      description: |
        No such record, or the authenticated user may not see it. The two
        cases are deliberately indistinguishable.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: not_found
            message: Dieser Eintrag wurde nicht gefunden.

  schemas:

    Error:
      type: object
      additionalProperties: false
      required: [error, message]
      properties:
        error:
          type: string
          description: A stable machine-readable code.
          enum:
            - bad_request
            - unauthenticated
            - csrf_token_invalid
            - proxy_secret_invalid
            - invalid_credentials
            - not_found
            - not_configured
            - no_linked_record
            - record_locked
            - change_pending
            - invalid_token
            - not_allowed
            - quota_reached
            - cannot_reply
            - not_delivered
            - username_taken
            - email_taken
            - server_error
        message:
          type: string
          description: |
            A human-readable message in the server's language. The portal
            renders its own translated text keyed off `error` and uses this
            only for logging.
        reference:
          type: string
          description: |
            Present only on failures the module recorded — that is, on
            `server_error`, never on a refusal it meant to give. The member
            is shown it so they can quote it, and an administrator finds the
            matching row on the module's diagnosis screen.

    Message:
      type: object
      additionalProperties: false
      required: [id, from, subject, body, sent_at, read, can_reply]
      properties:
        id:
          type: integer
        from:
          type: string
          description: |
            The sender's name where the address could be resolved to an
            account, and the address itself where it could not.
        subject:
          type: string
        body:
          type: string
          description: The message, without the email webtrees wrapped around it.
        sent_at:
          type: string
          format: date-time
        read:
          type: boolean
        can_reply:
          type: boolean
          description: |
            Whether `POST /messages/{id}/reply` would work. False when the
            address on the message belongs to no account — a contact form
            filled in by a visitor, a sender who has changed their address, a
            deleted account — and for one's own copy of a broadcast.

    Inbox:
      type: object
      additionalProperties: false
      required: [messages, unread]
      properties:
        messages:
          type: array
          items:
            $ref: '#/components/schemas/Message'
        unread:
          type: integer

    PushState:
      type: object
      additionalProperties: false
      required: [available, public_key, subscribed]
      properties:
        available:
          type: boolean
        public_key:
          type: string
          description: |
            The VAPID public key, base64url. Empty unless notifications are
            available. Public by design — a browser cannot subscribe without it.
        subscribed:
          type: boolean
          description: Whether this account has any device signed up.

    Conversation:
      type: object
      additionalProperties: false
      required: [id, member_id, name, unread, last_message]
      properties:
        id:
          type: integer
        member_id:
          type: integer
          nullable: true
          description: |
            The other person's portal member id, for linking to their page.
            Null when they have no member profile at all.
        name:
          type: string
          description: |
            Looked up by account rather than through the directory rule: an
            existing conversation is its own proof the two know each other, so
            a partner who has since left the directory keeps their name here.
        unread:
          type: integer
        last_message:
          allOf:
            - $ref: '#/components/schemas/ConversationMessage'
          nullable: true

    ConversationMessage:
      type: object
      additionalProperties: false
      required: [id, mine, body, sent_at, read]
      properties:
        id:
          type: integer
        mine:
          type: boolean
        body:
          type: string
          description: What was typed. Not a rendered email template.
        sent_at:
          type: string
          format: date-time
        read:
          type: boolean
          description: |
            Only meaningful on one's own messages, where it says the other side
            has read it.

    Transcript:
      type: object
      additionalProperties: false
      required: [conversation, messages, before]
      properties:
        conversation:
          $ref: '#/components/schemas/Conversation'
        messages:
          type: array
          items:
            $ref: '#/components/schemas/ConversationMessage'
        before:
          type: integer
          nullable: true
          description: The id to ask `?before=` with, or null at the beginning.

    AddressParts:
      type: object
      additionalProperties: false
      description: |
        An address as fields rather than as one line. Sent by a client that
        has fields; returned always — from the row where it has them, and
        otherwise from the best reading of the text, so that a row written
        before addresses had fields still fills the form in.

        Where parts are sent they also decide `value`: the two are one address
        written twice, and only one of them can be the member's own words.
      properties:
        street:
          type: string
          maxLength: 120
          description: Street and house number.
        postcode:
          type: string
          maxLength: 20
        city:
          type: string
          maxLength: 120
        country:
          type: string
          maxLength: 80

    ContactEntry:
      type: object
      additionalProperties: false
      required: [value, audience]
      properties:
        value:
          type: string
          maxLength: 255
          description: |
            The entry as one readable piece of text, and the only shape any
            reader ever gets — an address arrives here as its lines, street
            first, postcode and town together, country last.
        parts:
          allOf:
            - $ref: '#/components/schemas/AddressParts'
          description: |
            The address only. Absent for an e-mail address and a telephone
            number, which are genuinely one value each.
        audience:
          type: string
          description: |
            Decided per entry, never per member: "my email may go to the whole
            family" and "my address is for my brother" are different answers.
            `close_family` is the same distance as for invitations;
            `connections` is the people this member connected with, and shares
            nothing when the family has switched connections off.
          enum: [nobody, close_family, connections, members]

    OwnContact:
      type: object
      additionalProperties: false
      description: The member's own entries, keyed by kind.
      properties:
        email:
          $ref: '#/components/schemas/ContactEntry'
        phone:
          $ref: '#/components/schemas/ContactEntry'
        address:
          $ref: '#/components/schemas/ContactEntry'

    ContactSettings:
      type: object
      additionalProperties: false
      required: [enabled, contact]
      properties:
        enabled:
          type: boolean
          description: False when the family has switched contact sharing off.
        connections_enabled:
          type: boolean
          description: |
            Whether the `connections` audience means anything here. False when
            the family has switched connections off, in which case the portal
            does not offer the choice — an audience that silently shares
            nothing is a worse answer than one that is not offered. Optional:
            the module and the portal deploy separately.
        contact:
          $ref: '#/components/schemas/OwnContact'

    MailingList:
      type: object
      additionalProperties: false
      required: [key, name, description, subscribed, state]
      properties:
        key:
          type: string
          description: |
            Opaque and stable: the SHA-256 of the list's address. The address
            itself is never sent to the portal.
        name:
          type: string
          description: What the administrator called it.
        description:
          type: string
          description: |
            What arrives and how often, in the administrator's own words. May
            be empty.
        subscribed:
          type: boolean
          description: The member's answer, which is not the same as Exchange's.
        state:
          type: string
          enum: [applied, pending, failed]
          description: |
            Whether Exchange agrees yet. `applied` is the ordinary state and
            the screen says nothing about it. `pending` means the decision is
            recorded and on its way. `failed` means it is recorded and could
            not be delivered — the member is told that somebody is looking at
            it, and never why, because the reason is about a tenant they know
            nothing about.

    MailingLists:
      type: object
      additionalProperties: false
      required: [enabled, address, lists]
      properties:
        enabled:
          type: boolean
          description: |
            False when the family has not switched this on, has not configured
            a tenant, or has named no lists. The portal then shows nothing.
        address:
          type: string
          description: |
            The account address a subscription is made under — the one the
            invitation and password resets go to, not the one the member may
            have published under contact details. Empty when the account has
            none, in which case nothing can be subscribed.
        lists:
          type: array
          items:
            $ref: '#/components/schemas/MailingList'

    Health:
      type: object
      additionalProperties: false
      required: [status, version, schema_version]
      properties:
        status:
          type: string
          enum: [ok]
        version:
          type: string
          description: The module's version, so a deployment can prove itself.
        schema_version:
          type: integer
          description: The schema version this code expects.

    InvitationCandidate:
      allOf:
        - $ref: '#/components/schemas/IndividualRef'
        - type: object
          required: [relationship]
          properties:
            relationship:
              type: string
              nullable: true
              description: '"Ihr Bruder" — named by webtrees, in the request''s language.'

    MemberInvitation:
      type: object
      additionalProperties: false
      required: [id, name, email, expires_at]
      properties:
        id:
          type: integer
        name:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
        expires_at:
          type: string
          format: date-time

    InvitationOverview:
      type: object
      additionalProperties: false
      required: [enabled, linked, quota, remaining, candidates, invitations]
      properties:
        scope:
          type: string
          enum: [close_family, anyone]
          description: |
            Whom this reader may invite, and therefore which screen to draw.

            `close_family` is a member's: a handful of relatives within the
            configured number of steps, all of them in `candidates`, and a
            wheel is the right control for it.

            `anyone` is what somebody who can edit the tree gets — everybody
            they can see, which in a real archive is thousands of people.
            `candidates` is then only the first couple of hundred, and the
            screen should search rather than list. **A person absent from
            `candidates` may still be invited**: the endpoint applies the rule,
            not the list.

            It cannot be inferred from `candidates`, because a short list is
            also what a small family looks like.
        enabled:
          type: boolean
          description: False when the family has switched member invitations off.
        linked:
          type: boolean
          description: |
            False when this account is not linked to anybody in the tree, and
            therefore has no family the portal can identify.
        quota:
          type: integer
        remaining:
          type: integer
        candidates:
          type: array
          items:
            $ref: '#/components/schemas/InvitationCandidate'
        invitations:
          type: array
          items:
            $ref: '#/components/schemas/MemberInvitation'

    IssuedInvitation:
      type: object
      additionalProperties: false
      required: [link, invitation]
      properties:
        link:
          type: string
          description: |
            Shown once. Only a hash of the token is stored, so there is
            nothing to return on a later request.
        invitation:
          allOf:
            - $ref: '#/components/schemas/MemberInvitation'
          nullable: true

    InvitationPreview:
      type: object
      additionalProperties: false
      required: [tree, invited_name, email, expires_at]
      properties:
        tree:
          $ref: '#/components/schemas/Tree'
        invited_name:
          type: string
          nullable: true
          description: |
            The name the invitation was issued for, as it read at that moment.
            A snapshot on the invitation, not a lookup — null when the
            invitation is not tied to anybody in the tree.
        email:
          type: string
          nullable: true
          description: Where the administrator sent it, used to prefill the form.
        expires_at:
          type: string
          format: date-time

    InvitationAcceptance:
      type: object
      additionalProperties: false
      required: [token, username, real_name, email, password]
      properties:
        token:
          type: string
          minLength: 1
        username:
          type: string
          minLength: 3
          maxLength: 32
          description: |
            No spaces and no `@`. webtrees signs people in with a query that
            matches a username *or* an email address, so a username shaped
            like an address could stand in front of somebody else's account.
        real_name:
          type: string
          maxLength: 64
        email:
          type: string
          format: email
          maxLength: 64
          description: |
            A contact address. It does not have to match the one the
            invitation was sent to — the credential is the token.
        password:
          type: string
          format: password
          minLength: 8

    CsrfToken:
      type: object
      additionalProperties: false
      required: [csrf_token, remember_days]
      properties:
        csrf_token:
          type: string
          minLength: 1
        remember_days:
          type: integer
          minimum: 0
          description: |
            How many days a member may stay signed in for on one device, or
            `0` where the administrator has not switched that on — in which
            case the login screen offers nothing and a `remember` in the login
            body is ignored.

            Carried here because the login screen is the one screen with no
            session, and so no `GET /me` to ask. It discloses nothing: one
            setting about this portal's own login, the same for everybody.

    Credentials:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 255
          description: webtrees username or email address.
        password:
          type: string
          minLength: 1
          format: password
        remember:
          type: boolean
          default: false
          description: |
            Stay signed in on this device. When `true` and the administrator
            allows it (see `remember_days` on `GET /csrf`), the response sets a
            `PORTAL_REMEMBER` cookie — HttpOnly, Secure, SameSite=Lax — that
            lets this device resume a session without a password until it
            expires.

            When `false` or absent, any such cookie the browser is holding is
            revoked and cleared: not ticking the box is an instruction, not a
            silence.

    Tree:
      type: object
      additionalProperties: false
      required: [name, title]
      properties:
        name:
          type: string
          description: The tree's internal name, used in webtrees URLs.
        title:
          type: string

    User:
      type: object
      additionalProperties: false
      required: [id, username, real_name, email, language, role]
      properties:
        id:
          type: integer
          description: The webtrees user id.
        username:
          type: string
        real_name:
          type: string
        email:
          type: string
          format: email
        language:
          type: string
          description: The user's webtrees language tag, e.g. `de` or `en-GB`.
        role:
          type: string
          description: |
            The user's role in the configured tree. The portal shows the
            "open in webtrees" affordances only to editors and above.
          enum: [visitor, member, editor, moderator, manager, administrator]

    MemberProfile:
      description: The portal's own record for a member, from `portal_member_profile`.
      type: object
      additionalProperties: false
      required: [id, visible_in_directory, display_name_override, consent_recorded_at]
      properties:
        id:
          type: integer
          description: Surrogate primary key. The member id used by `/members/{id}`.
        visible_in_directory:
          type: boolean
        display_name_override:
          type: [string, 'null']
        consent_recorded_at:
          type: [string, 'null']
          format: date-time

    Accepted:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          const: accepted

    MemberProfileUpdate:
      description: |
        Absent fields are left unchanged. This is a PATCH, not a replacement.
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        visible_in_directory:
          type: boolean
        display_name_override:
          type: [string, 'null']
          maxLength: 128
        language:
          type: string
          description: |
            The member's own language, as the account's webtrees preference —
            not a device setting. `de` or `en` from the portal; the site
            resolves it to a tag it actually has enabled (`de`, `en-US`), and
            refuses with 400 when it has none.

            This is what makes the choice follow the member to their next
            telephone, and what decides the language a notification e-mail
            from webtrees reaches them in.
          example: de

    IndividualUpdate:
      description: |
        The complete set of things a member may change about themselves.
        Absent fields are left unchanged; a field sent as `null` removes that
        fact from the record.

        Values are plain text. Anything resembling GEDCOM structure in a value
        is rejected rather than escaped — a newline in a value would otherwise
        let a member append arbitrary facts to their own record.
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        given_names:
          type: [string, 'null']
          maxLength: 120
        surname:
          type: [string, 'null']
          maxLength: 120
        birth_date:
          type: [string, 'null']
          maxLength: 60
          description: |
            A GEDCOM date, parsed by webtrees' own Date class — so `12 MAR
            1985`, `ABT 1985` and `BET 1980 AND 1985` are all valid. Rejected
            if webtrees cannot parse it.
        birth_place:
          type: [string, 'null']
          maxLength: 120
        occupation:
          type: [string, 'null']
          maxLength: 120
        address:
          type: [string, 'null']
          maxLength: 200
        email:
          type: [string, 'null']
          maxLength: 120
        phone:
          type: [string, 'null']
          maxLength: 60
        website:
          type: [string, 'null']
          maxLength: 200

    PendingIndividual:
      type: object
      additionalProperties: false
      required: [status, individual, pending_change]
      properties:
        status:
          type: string
          enum: [pending_approval, applied]
          description: |
            What actually happened, not what usually happens.

            `pending_approval` is the normal case and the one the whole design
            is built around: the edit is in webtrees' pending changes list and
            an editor decides.

            `applied` is what webtrees does when the *acting* user has the
            `auto_accept` preference — editors and administrators usually do,
            members do not. The change is already live and there is nothing to
            approve. The portal has to be able to say so: telling an
            administrator their change is under review, when it is not, sends
            them looking for it in a list it will never appear in.
        individual:
          oneOf:
            - $ref: '#/components/schemas/Individual'
            - type: 'null'
          description: The record as currently approved — not the proposed version.

    Me:
      type: object
      additionalProperties: false
      required: [user, profile, individual, tree, unread_messages, csrf_token]
      properties:
        user:
          $ref: '#/components/schemas/User'
        profile:
          oneOf:
            - $ref: '#/components/schemas/MemberProfile'
            - type: 'null'
          description: |
            `null` when no portal profile row exists yet for this webtrees
            user. The portal treats that as "not visible in the directory,
            no consent recorded".
        individual:
          oneOf:
            - $ref: '#/components/schemas/Individual'
            - type: 'null'
          description: |
            The member's own record. `null` when an administrator has not
            linked this webtrees account to an individual in the configured
            tree (the per-tree user setting `gedcomid`).
        tree:
          $ref: '#/components/schemas/Tree'
        unread_messages:
          type: integer
          description: |
            Carried here so the navigation badge needs no request of its own.
            The inbox only — conversations are counted separately, because a
            member with one of each should not be told "2 unread" and then find
            a single message.
        unread_conversations:
          type: integer
          description: |
            Unread messages across every conversation. The badge shows the two
            added together; the two lists show their own.
        connection_requests:
          type: integer
          description: |
            How many members are waiting for this one to say whether they know
            them. Here for the same reason as `unread_messages`: the bar shows
            it on every screen. Optional, because the module and the portal
            deploy separately and can be a version apart.
        csrf_token:
          type: string

    DateValue:
      type: object
      additionalProperties: false
      required: [display, gedcom, year]
      properties:
        display:
          type: string
          description: |
            Plain text, formatted by webtrees for the tree's calendar and
            date-format preferences.
        gedcom:
          type: string
          description: The raw GEDCOM date value, e.g. `ABT 1889`.
        year:
          type: [integer, 'null']
          description: Gregorian year, or `null` when the date has no usable year.

    Event:
      type: object
      additionalProperties: false
      required: [tag, label, value, date, place]
      properties:
        tag:
          type: string
          description: The GEDCOM tag path, e.g. `INDI:BIRT`.
        label:
          type: string
          description: webtrees' translated label for the tag.
        value:
          type: [string, 'null']
          description: The fact's own value, where it carries one (e.g. an occupation).
        date:
          oneOf:
            - $ref: '#/components/schemas/DateValue'
            - type: 'null'
        place:
          type: [string, 'null']

    RelationshipResult:
      type: object
      additionalProperties: false
      required: [a, b, problem, relationship, detail]
      properties:
        a:
          type: string
          description: The first number, as it was received.
        b:
          type: string
        problem:
          description: |
            `incomplete` — one of the two was not given.
            `invalid_a` / `invalid_b` — not an archive number: the wrong shape,
            or a line the archive does not have.
            `identical` — the same person twice.
            `null` — there is an answer.
          type: [string, 'null']
          enum: [incomplete, invalid_a, invalid_b, identical, null]
        relationship:
          type: [string, 'null']
          description: |
            Named in the request's language. Where the sex is not known — and
            two bare numbers never say — both forms are given, joined:
            "Bruder/Schwester".
          example: Cousin/Cousine 2. Grades
        detail:
          description: |
            The working, for anybody who wants to check it. `null` when there
            is no answer.
          oneOf:
            - $ref: '#/components/schemas/RelationshipDetail'
            - type: 'null'

    RelationshipDetail:
      type: object
      additionalProperties: false
      required: [kind, generations, distance, degree]
      properties:
        kind:
          type: string
          enum: [self, sibling, ancestor, descendant, nephew, uncle, cousin]
        generations:
          type: integer
          description: |
            How many generations apart. Positive when the second person is the
            elder.
        distance:
          type: integer
          description: How far the first person stands from the ancestor they share.
        degree:
          type: [integer, 'null']
          description: |
            How far out a collateral relative sits — "2. Grades". `null` for
            the near ones, which the family names without a degree.

    SearchPage:
      type: object
      additionalProperties: false
      required: [items, total, page, per_page, truncated]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/IndividualRef'
        total:
          type: integer
          description: How many people matched, across all pages.
        page:
          type: integer
        per_page:
          type: integer
        truncated:
          type: boolean
          description: |
            True when the query matched more than the server will consider, or
            when the tree is larger than one request will read. `total` is then
            a floor rather than a total, and the screen says so — a number that
            is quietly wrong is worse than no number.

    TreeIndex:
      type: object
      additionalProperties: false
      required: [surnames, places, truncated]
      properties:
        surnames:
          type: array
          description: |
            Every surname in the tree, in the request language's alphabetical
            order. A person recorded under both a maiden and a married name is
            counted under each, which is the whole reason a genealogy database
            keeps both.
          items:
            $ref: '#/components/schemas/IndexEntry'
        places:
          type: array
          description: |
            Every place an event happened in, most people first. Nobody reads a
            place list looking for one entry — they read it to see where this
            family has been.
          items:
            $ref: '#/components/schemas/IndexEntry'
        truncated:
          type: boolean
          description: True when the tree outgrew what one request will read.

    IndexEntry:
      type: object
      additionalProperties: false
      required: [name, count]
      properties:
        name:
          type: string
          description: Pass this back to `/search` as `surname` or `place`.
        count:
          type: integer
          minimum: 1

    IndividualRef:
      description: |
        A reference to an individual the caller is allowed to see. Individuals
        the caller may not see are omitted from the containing list entirely.
      type: object
      additionalProperties: false
      required: [xref, name, sex, is_deceased, lifespan, portrait, references, relationship]
      properties:
        xref:
          type: string
        name:
          type: string
          description: |
            Plain text. Where the record is visible but its name is not,
            this is webtrees' own placeholder for a private name.
        sex:
          type: string
          enum: [M, F, X, U]
        is_deceased:
          type: boolean
        lifespan:
          type: [string, 'null']
          description: e.g. `1889–1976`. `null` when neither year is visible.
        portrait:
          description: |
            The one picture that stands for this person, or `null`. webtrees'
            own choice — the first media object on the record with an image in
            it — so the portal and webtrees agree about which face belongs to a
            name.

            Carried on the *reference* shape, so a directory entry or a
            relative list can show a face without a request each.
          oneOf:
            - $ref: '#/components/schemas/Photo'
            - type: 'null'
        references:
          type: array
          description: |
            User reference numbers (`REFN`) on the record — the archive's own
            numbering, not webtrees'. Usually none or one. Empty when the
            record carries none, or when fact-level privacy hides them.

            On the *reference* shape as well as the full record, because in
            this family the number is how two people with the same name are
            told apart: a card without it is a card that has to be opened.
            It discloses nothing new — same facts, same access level.

            Deliberately a field rather than an entry in `events`: it is
            bookkeeping, not something that happened to the person. It is
            never part of `name`.
          items:
            $ref: '#/components/schemas/Reference'
        relationship:
          type: [string, 'null']
          description: |
            How the authenticated member is related to this person, named by
            webtrees in the request's language — "Ihre Cousine", "your
            great-grandfather".

            Carried wherever a card names somebody: a page of search results
            is otherwise names and years, and this is the line that turns one
            of them into the person the reader was looking for.

            `null` whenever there is nothing safe or useful to say: the
            member's account is not linked to a record, this *is* their
            record, no relationship was found within four steps, or — the one
            that matters — every path between them runs through someone the
            member may not see. A relationship name encodes the shape of the
            path that produced it, so naming one through a hidden person would
            disclose that they exist.
          example: Ihre Urgroßmutter

    Reference:
      type: object
      additionalProperties: false
      required:
        - number
        - type
      properties:
        number:
          type: string
          description: The reference number itself, e.g. "4711".
          example: '4711'
        type:
          type: [string, 'null']
          description: |
            What kind of reference it is (`REFN:TYPE`), where the record says
            so — e.g. "SB" for this archive's own numbering.
          example: SB

    Photo:
      type: object
      additionalProperties: false
      required: [id, title, thumbnail_url, image_url]
      properties:
        id:
          type: string
          description: Identifies the file within its media record.
          example: 6f8a1c2e4b7d9013a5c6e8f0b2d4a6c8
        title:
          type: [string, 'null']
          example: Anna im Garten
        thumbnail_url:
          type: string
          description: |
            A square thumbnail, **relative to the portal's own origin**.

            Deliberately not webtrees' media URL. That points at the webtrees
            host, and the session cookie is scoped to the portal's origin, so
            the browser would arrive without a session and get webtrees'
            "forbidden" replacement image back. Every picture would be a grey
            box.
          example: /api/v1/media/M1/6f8a1c2e4b7d9013a5c6e8f0b2d4a6c8/thumbnail
        image_url:
          type: string
          description: The full-size file, same origin, same reasoning.
          example: /api/v1/media/M1/6f8a1c2e4b7d9013a5c6e8f0b2d4a6c8/image

    Ancestor:
      allOf:
        - $ref: '#/components/schemas/IndividualRef'
        - type: object
          required:
            - position
            - generation
          properties:
            position:
              type: integer
              minimum: 1
              description: |
                The Ahnentafel number. 1 is the root, 2n is a father and 2n+1
                a mother.

                Numbers are not contiguous: a person the member may not see is
                absent, and so is everyone above them. A missing number means
                "nothing to show here", never "somebody hidden lives here" —
                the two are indistinguishable by design, because a tree with a
                labelled hole in it is a tree that tells you what fills it.
              example: 5
            generation:
              type: integer
              minimum: 0
              description: 0 for the root, 1 for parents, and so on.
              example: 2

    AncestorPage:
      type: object
      additionalProperties: false
      required:
        - generations
        - people
      properties:
        generations:
          type: integer
          description: How many generations were actually walked, after clamping.
          example: 4
        people:
          type: array
          description: The visible ancestors, root first, in Ahnentafel order.
          items:
            $ref: '#/components/schemas/Ancestor'

    Individual:
      allOf:
        - $ref: '#/components/schemas/IndividualRef'
        - type: object
          additionalProperties: false
          required:
            - name_alternative
            - photos
            - birth
            - death
            - events
            - parents
            - siblings
            - spouses
            - children
            - pending_change
            - webtrees_url
          properties:
            name_alternative:
              type: [string, 'null']
              description: A name in an alternative character set, where one exists.
            photos:
              type: array
              description: |
                Every picture on the record this member may see, `portrait`
                included. A media record they may not see is absent — not a
                placeholder, not a count.
              items:
                $ref: '#/components/schemas/Photo'
            birth:
              oneOf:
                - $ref: '#/components/schemas/Event'
                - type: 'null'
            death:
              oneOf:
                - $ref: '#/components/schemas/Event'
                - type: 'null'
            events:
              type: array
              description: |
                Visible facts, in webtrees' own order. Restricted to an
                allow-list of tags for Phase 1; see NOTES.md.
              items:
                $ref: '#/components/schemas/Event'
            parents:
              type: array
              items:
                $ref: '#/components/schemas/IndividualRef'
            siblings:
              type: array
              items:
                $ref: '#/components/schemas/IndividualRef'
            spouses:
              type: array
              items:
                $ref: '#/components/schemas/IndividualRef'
            children:
              type: array
              items:
                $ref: '#/components/schemas/IndividualRef'
            invitable:
              type: boolean
              description: |
                Whether the authenticated reader could invite this person into
                the portal — the same rule `POST /invitations` applies, asked
                here so that an offer and its answer cannot disagree.

                `false` for every reason there could be: dead, already an
                account holder, already invited, too distant, the reader's
                quota spent, or the family has switched member invitations
                off. Deliberately not distinguishable — a member must not be
                able to learn which by looking.

                A member may invite their close family; somebody who can edit
                the tree may invite anybody they can see, because they already
                can from the control panel.
            pending_change:
              type: boolean
              description: |
                True when this record has an edit waiting for an editor to
                approve it. The portal shows the member that their change was
                received but is not live yet.
            webtrees_url:
              type: string
              format: uri
              description: |
                Absolute URL on the webtrees host that lands the reader on this
                record — signing them in first if they are not signed in there.

                Not the record's own address. The portal and webtrees are
                separate origins and the session cookie is first-party to the
                portal, so a member following a link out is always a signed-out
                visitor on the other side. Sent straight to the record they get
                a login page that loses the destination, or none at all and a
                "does not exist" for a private record; sent to the login page
                they get thrown to their own user page if they happen to be
                signed in already. This URL is a redirect served by the module
                that asks the question at the moment it can be answered.

                Treat it as opaque. It grants nothing — webtrees enforces its
                own privacy on arrival.

    MemberSummary:
      type: object
      additionalProperties: false
      required: [id, display_name, individual]
      properties:
        id:
          type: integer
          description: The portal member id.
        display_name:
          type: string
          description: |
            Portal data the member consented to publish — their
            `display_name_override` if set, otherwise their webtrees real
            name. Never taken from GEDCOM.
        individual:
          oneOf:
            - $ref: '#/components/schemas/IndividualRef'
            - type: 'null'
          description: |
            `null` when the member has no linked record, or when the caller
            may not see it.
        connection:
          allOf:
            - $ref: '#/components/schemas/ConnectionState'
          description: |
            Carried on every row of the directory, so a request can be sent
            from the list without opening the person first. Cheap enough to
            be here — it is one row of one table, unlike contact details,
            which walk the tree and are deliberately absent from the list.
            Optional: the module and the portal deploy separately.

    MemberDetail:
      allOf:
        - $ref: '#/components/schemas/MemberSummary'
        - type: object
          additionalProperties: false
          required: [individual_detail, contact, can_message]
          properties:
            individual_detail:
              oneOf:
                - $ref: '#/components/schemas/Individual'
                - type: 'null'
            contact:
              type: object
              additionalProperties:
                type: string
              description: |
                Only what this reader may see, already decided by the server —
                the values that reached them, and nothing about the entries
                that did not. Absent means absent.
            can_message:
              type: boolean
              description: |
                Whether the message form is worth showing. The endpoint checks
                again; this only saves the member from a button that refuses.
            connections_enabled:
              type: boolean
              description: False when the family has switched connections off.

    Connection:
      type: object
      additionalProperties: false
      required: [id, status, source, requested_by_me, member_id, name, individual, since]
      properties:
        id:
          type: integer
        status:
          type: string
          enum: [pending, accepted]
        source:
          type: string
          description: |
            How the two found each other — the difference between "we were in
            the same room" and "somebody typed my number".
          enum: [code, reference]
        requested_by_me:
          type: boolean
          description: |
            Who asked. Not who may end it: either of them may, at any time.
        member_id:
          type: [integer, 'null']
          description: |
            The other member's portal id, for the page that shows what they
            share. `null` only while a request is unanswered and no profile
            row exists yet — and there is nothing to open until then.
        name:
          type: string
          description: |
            The other member's display name. Portal data, not GEDCOM: it is
            the name they publish, or the one on their account.
        individual:
          oneOf:
            - $ref: '#/components/schemas/IndividualRef'
            - type: 'null'
          description: |
            Their record in the tree, privacy-filtered like everywhere else,
            and `null` when there is none or the reader may not see it. Being
            connected does not lift the tree's own privacy rules.
        since:
          type: string
          format: date-time

    ConnectionState:
      type: object
      additionalProperties: false
      required: [status, id]
      description: |
        Where the reader and one other member stand, so a screen can offer the
        one button that means something. `self` is the reader's own row.
      properties:
        status:
          type: string
          enum: [none, requested, incoming, connected, self]
        id:
          type: [integer, 'null']
          description: The connection's id, for accepting or ending it.

    ConnectionOverview:
      type: object
      additionalProperties: false
      required: [enabled, code_valid_minutes, connections, incoming, outgoing]
      properties:
        enabled:
          type: boolean
          description: False when the family has switched connections off.
        code_valid_minutes:
          type: integer
          description: How long a connection code lasts, so the screen can say so.
        link_valid_days:
          type: integer
          description: |
            The same, for a link that is sent rather than shown. Optional: the
            module and the portal deploy separately.
        links:
          type: array
          description: Links this member sent that nobody has used yet.
          items:
            $ref: '#/components/schemas/SentLink'
        connections:
          type: array
          description: People this member is in touch with, by display name.
          items:
            $ref: '#/components/schemas/Connection'
        incoming:
          type: array
          description: Requests waiting for this member to answer.
          items:
            $ref: '#/components/schemas/Connection'
        outgoing:
          type: array
          description: Requests this member made and nobody has answered yet.
          items:
            $ref: '#/components/schemas/Connection'

    ConnectionResult:
      allOf:
        - $ref: '#/components/schemas/ConnectionOverview'
        - type: object
          additionalProperties: false
          required: [status, name]
          properties:
            status:
              type: string
              enum: [connected, requested, already_connected]
              description: |
                `already_connected` means nothing was written: the number
                belongs to somebody this member is already connected with.
                It is answered by name whether or not that member is listed
                in the directory — they are already in the asking member's
                own contacts, so there is nothing left to disclose.
            name:
              type: [string, 'null']
              description: The other member, so the screen can say who.

    ConnectionLink:
      type: object
      additionalProperties: false
      required: [url, expires_at, valid_days]
      properties:
        url:
          type: string
          format: uri
          description: |
            The link to send. It opens the portal's `/connect` screen, the
            same one a scanned QR code opens.
        expires_at:
          type: string
          format: date-time
        valid_days:
          type: integer

    SentLink:
      type: object
      additionalProperties: false
      required: [id, created_at, expires_at]
      description: |
        One link the member sent and nobody has used yet. No name against it:
        they wrote to somebody themselves, and the portal never learned who.
      properties:
        id:
          type: integer
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time

    ConnectionCode:
      type: object
      additionalProperties: false
      required: [url, expires_at, valid_minutes]
      properties:
        url:
          type: string
          format: uri
          description: |
            The link to put in the QR code. It opens the portal's `/connect`
            screen, so any telephone camera can read it — no scanner in the
            portal, and nothing to install.
        expires_at:
          type: string
          format: date-time
        valid_minutes:
          type: integer

    MemberPage:
      type: object
      additionalProperties: false
      required: [items, total, page, per_page]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/MemberSummary'
        total:
          type: integer
        page:
          type: integer
        per_page:
          type: integer
        connections_enabled:
          type: boolean
          description: |
            False when the family has switched connections off, in which case
            the list offers nothing rather than a button the endpoint would
            refuse. Optional: the module and the portal deploy separately.

security:
  - sessionCookie: []
