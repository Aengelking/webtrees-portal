openapi: 3.1.0

info:
  title: webtrees Member Portal API
  version: 1.0.0-phase1
  description: |
    Read-only JSON API served by the webtrees custom module `portal_api`
    (`modules_v4/portal_api/`). It is consumed by the React member portal,
    which is deployed to Cloudflare Workers and proxies `/api/*` onto this API
    so that both live on the same origin.

    ## Authentication

    Cookie-session authentication, reusing webtrees' own session and user
    accounts. `POST /session` verifies the credentials through webtrees'
    authentication path and starts a webtrees session; the browser receives
    the standard webtrees session cookie
    (`__Secure-WT-ID` over HTTPS, `WT2_SESSION` otherwise) with
    `HttpOnly; Secure; SameSite=Lax; Path=/`.

    There is no bearer token. Nothing credential-shaped is readable from
    JavaScript.

    ## CSRF

    Every request whose method is not `GET`, `HEAD` or `OPTIONS` must carry
    the header `X-CSRF-TOKEN`, holding the token from `GET /csrf`. The token
    is webtrees' own session CSRF token (`Session::getCsrfToken()`).

    `SameSite=Lax` alone is not treated as sufficient.

    Note that webtrees core runs its own CSRF middleware in front of every
    `POST` route in the application, and it answers a bad token with a `302`
    redirect rather than a JSON error. Clients should therefore treat a
    redirect or a non-JSON response to an unsafe request as "token stale",
    re-fetch `GET /csrf` and retry once. All other methods are handled by this
    module and answer with `403 csrf_token_invalid`.

    ## Language

    Parts of a response are rendered by webtrees rather than by the client:
    `Event.label` (the name of a GEDCOM fact), `DateValue.display` (a date
    written out for a reader) and the placeholders that stand in for a name
    that may not be shown. Those follow the request's `Accept-Language`
    header, matched against the languages the webtrees installation has
    enabled — exactly, then by language without region, so `en` finds `en-US`.

    A request with no `Accept-Language`, or one asking only for languages that
    are not installed, is answered in whatever language webtrees would have
    chosen for it; nothing fails. `POST /session` is the one exception worth
    knowing about: with no header, it answers in the language set on the
    member's webtrees account.

    Responses carry `Vary: Cookie, Accept-Language`. Only `display` moves —
    `DateValue.gedcom` and `Event.tag` are machine-readable and stay put.

    ## Caching

    Every response carries `Cache-Control: private, no-store`. The Cloudflare
    Worker that proxies `/api/*` must also be configured to bypass the
    cache. A cached authenticated response would show one member another
    member's relatives.

    ## Privacy

    Every genealogy record in every response has passed webtrees' own
    visibility logic (`GedcomRecord::canShow()` and per-fact `Fact::canShow()`)
    at the authenticated user's access level for the configured tree. An
    individual the caller may not see is absent from the response entirely —
    including from nested relative lists and from directory entries — rather
    than being present in a redacted form, so that response shape does not leak
    existence.

servers:
  - url: /api/v1
    description: Same-origin path, via the portal's Cloudflare Worker
  - url: https://webtrees.example.org/api/v1
    description: The webtrees host directly (local development)

tags:
  - name: session
    description: Login, logout and CSRF
  - name: me
    description: The authenticated member
  - name: individuals
    description: Genealogy records
  - name: members
    description: Member directory

paths:
  /csrf:
    get:
      tags: [session]
      summary: Get a CSRF token
      description: |
        Returns the CSRF token for the current session, creating a session
        (and therefore setting the session cookie) if there is not one yet.
        Safe to call unauthenticated — this is how the login screen obtains a
        token.
      security: []
      operationId: getCsrfToken
      responses:
        '200':
          description: The current session's CSRF token
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsrfToken'

  /session:
    post:
      tags: [session]
      summary: Log in
      description: |
        Verifies username (or email) and password through webtrees'
        `UserService`/`User::checkPassword()` and starts a session.

        All failures — unknown user, wrong password, unverified email address,
        account not yet approved by an administrator, and rate limiting —
        return the same `401 invalid_credentials` body. The real reason is
        written to the webtrees authentication log server-side only. Requests
        that exceed the rate limit also return `401 invalid_credentials`, so
        that the limiter cannot be used to probe for valid usernames.
      security: []
      operationId: createSession
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Credentials'
      responses:
        '200':
          description: Logged in
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: |
            Authentication failed. Deliberately indistinguishable across
            wrong password, unknown user, unverified account, unapproved
            account and rate limiting.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: invalid_credentials
                message: Benutzername oder Passwort ist falsch.
        '403':
          $ref: '#/components/responses/Forbidden'

    delete:
      tags: [session]
      summary: Log out
      description: |
        Destroys the server-side session. Returns a fresh CSRF token, because
        destroying the session invalidates the old one.
      operationId: deleteSession
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '200':
          description: Logged out
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsrfToken'
        '403':
          $ref: '#/components/responses/Forbidden'

  /me:
    get:
      tags: [me]
      summary: The authenticated member and their own record
      operationId: getMe
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: The authenticated member
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /me/profile:
    patch:
      tags: [me]
      summary: Update the member's own portal settings
      description: |
        Portal-native data only — this endpoint never touches GEDCOM. Fields
        that are absent are left alone; `display_name_override` may be sent as
        `null` to clear it.

        Setting `visible_in_directory` to true records the moment of consent in
        `consent_recorded_at`. Setting it to false clears that timestamp:
        withdrawn consent should not leave a record saying consent was given.
      operationId: updateMyProfile
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemberProfileUpdate'
      responses:
        '200':
          description: The updated profile
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberProfile'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /me/individual:
    put:
      tags: [me]
      summary: Propose changes to the member's own record
      description: |
        Submits an edit to the member's *own* linked individual record. The
        target is never taken from the request — it is whichever record
        webtrees links to the authenticated account — so this endpoint cannot
        be pointed at anyone else.

        The change does not take effect. It is written to webtrees' pending
        changes queue exactly as an editor's own edit would be, with a `CHAN`
        entry naming the member, and waits for an editor to approve it in
        webtrees. The response is therefore `202`, and the `individual` it
        returns is still the *approved* version.

        Only the fields listed in `IndividualUpdate` can be changed. Every
        other fact on the record — including facts the member is not allowed
        to see — is preserved untouched.
      operationId: updateMyIndividual
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IndividualUpdate'
      responses:
        '202':
          description: |
            The change was queued for approval. Nothing has changed yet.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PendingIndividual'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: |
            The account is not linked to a record, or the record is locked
            against editing.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /password/request:
    post:
      tags: [session]
      summary: Ask for a password reset link
      description: |
        Always answers `202`, whether or not the address belongs to an
        account, and takes a similar amount of time either way. Anything else
        would turn this into a way to find out who has an account.

        Uses webtrees' own reset mechanism: a token in the user's
        `password-token` preference, valid for one hour, delivered by
        webtrees' mail configuration. The link in the email points at the
        portal, not at webtrees.
      security: []
      operationId: requestPasswordReset
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        '202':
          description: Accepted — said the same thing regardless of the outcome.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Accepted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'

  /password/reset:
    post:
      tags: [session]
      summary: Set a new password using a token from the email
      description: |
        A valid token signs the member in, as webtrees' own reset does, so the
        response is the same `Me` payload as `POST /session`.
      security: []
      operationId: resetPassword
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token, password]
              properties:
                token:
                  type: string
                  minLength: 1
                password:
                  type: string
                  format: password
                  minLength: 8
      responses:
        '200':
          description: The password was changed and the member is signed in.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '400':
          description: |
            The token is unknown or has expired, or the password is too short.
            The two are distinguishable: a token is not a secret worth
            protecting once it has expired, and a member who waited too long
            needs to be told so.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/Forbidden'

  /invitation/preview:
    post:
      tags: [session]
      summary: What does this invitation open?
      description: |
        A read, done with `POST`, on purpose. The token has to travel in the
        body: a `GET /invitation/{token}` would write the credential into the
        webserver's access log, into any proxy in front of it, and into the
        `Referer` of every request the resulting page makes.

        The answer is deliberately small — the family tree's title and the
        name the invitation was issued for. No XREF and no genealogy record:
        the reader is not signed in. The name is a snapshot stored on the
        invitation when it was issued, so nothing on this path reads the
        family tree.

        Unknown, expired, spent, withdrawn and rate-limited all produce the
        same `invalid_token`.
      security: []
      operationId: previewInvitation
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token]
              properties:
                token:
                  type: string
                  minLength: 1
      responses:
        '200':
          description: The invitation is still good.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationPreview'
        '400':
          description: The invitation cannot be used. One answer for every reason.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/Forbidden'

  /invitation/accept:
    post:
      tags: [session]
      summary: Turn an invitation into an account
      description: |
        Creates a plain webtrees user account — there is no second user store
        — already verified and already approved, with the role `member` on the
        portal's tree, linked to the individual the invitation named. It then
        signs the new member in, so the response is the same `Me` payload as
        `POST /session`.

        The invitation is claimed with a conditional update, so two requests
        arriving together cannot both produce an account. A refusal that
        creates nothing — a username somebody else has, a password that is too
        short — leaves the invitation usable.
      security: []
      operationId: acceptInvitation
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvitationAcceptance'
      responses:
        '201':
          description: The account exists and the member is signed in.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '400':
          description: |
            The invitation cannot be used, or the account details are not
            acceptable — a password shorter than eight characters, a username
            outside 3–32 characters or containing a space or `@`, or an
            address that is not an address.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: |
            The username or the email address already belongs to an account.
            `username_taken` or `email_taken`. These do say something about
            the installation, which is unavoidable in a form somebody has to
            be able to complete; they are reachable only while holding a valid
            invitation.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /health:
    get:
      tags: [session]
      summary: Is the chain working?
      description: |
        Answering this at all takes a request through the Cloudflare Worker,
        its proxy secret, whatever URL form webtrees needs, PHP, webtrees'
        bootstrap, this module's `boot()`, the database and the tree
        configuration. One request either proves all of that or reports the
        first thing that is wrong.

        Unauthenticated on purpose — a health check that needs credentials is
        a health check nobody runs. The payload is deliberately dull: no tree
        name, no counts, nothing that would make the endpoint worth finding.

        `version` is the one thing it does disclose, and it is what turns "the
        upload reported success" into "the new code is actually running".
      security: []
      operationId: health
      responses:
        '200':
          description: Everything the portal needs is in place.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          description: |
            The module is running but cannot serve a family tree. Deliberately
            *not* recorded in the module's error log: an uptime monitor
            polling a half-configured installation would otherwise fill it.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /individuals/{xref}:
    get:
      tags: [individuals]
      summary: One individual record, privacy-filtered
      description: |
        Returns `404` both when the record does not exist and when the
        authenticated user may not see it, so that the response does not
        disclose which of the two is the case.
      operationId: getIndividual
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - name: xref
          in: path
          required: true
          description: The GEDCOM XREF of the individual, e.g. `X1234`.
          schema:
            type: string
            pattern: '^[A-Za-z0-9_.\-]{1,20}$'
      responses:
        '200':
          description: The individual
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Individual'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /individuals/{xref}/ancestors:
    get:
      tags: [Tree]
      summary: A person's ancestors, several generations at once
      description: |
        The pedigree above one person, flat, in Ahnentafel numbering: the root
        is 1, a father is 2n and a mother is 2n+1. The client indexes by
        `position` and never walks a nested structure.

        Nothing here is visible that stepping from relative to relative would
        not also reach. The walk runs at the member's access level and **stops**
        at anyone they may not see: that person is absent, and so is everyone
        above them. There is no placeholder and no gap to read meaning into —
        the branch simply ends, exactly as it does on the profile screen.

        This exists so that four generations are one request rather than
        fifteen, which matters on a phone and on shared hosting.
      operationId: getAncestors
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - name: xref
          in: path
          required: true
          description: The record to start from.
          schema:
            type: string
        - name: generations
          in: query
          required: false
          description: |
            How many generations above the root to include. Clamped to 1..6
            rather than refused; the response says what was used.
          schema:
            type: integer
            minimum: 1
            maximum: 6
            default: 4
      responses:
        '200':
          description: The visible ancestors.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AncestorPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /media/{xref}/{fact}/{size}:
    get:
      tags: [Tree]
      summary: The bytes of a photograph
      description: |
        A picture, served from the portal's own origin so that the request
        carries the member's session.

        webtrees' own media URLs point at the webtrees host, and the session
        cookie is deliberately scoped to the portal's origin — a browser
        following one would arrive with no session, fail `canShow()`, and get
        webtrees' "forbidden" replacement image. So the URLs in `Photo` are
        these, and the bytes make one extra hop.

        The rendering is webtrees': its image factory produces the thumbnail
        and applies whatever watermark it would apply on its own pages for this
        user. What is decided here is only whether this member may see the
        picture, and for how long a browser may keep it.

        **The one response in this API that is not `no-store`.** It is
        `private, max-age=86400`: a browser may keep it, a shared cache may
        not. A gallery re-fetched on every scroll costs a phone its battery for
        no reason; `public`, which is what webtrees itself sends, would let a
        CDN edge hand one member's photograph to the next member who asks.
      operationId: getMedia
      parameters:
        - name: xref
          in: path
          required: true
          description: The media record.
          schema:
            type: string
        - name: fact
          in: path
          required: true
          description: Which file within that record — `Photo.id`.
          schema:
            type: string
            pattern: '^[0-9a-f]{32}$'
        - name: size
          in: path
          required: true
          schema:
            type: string
            enum: [thumbnail, image]
      responses:
        '200':
          description: The image.
          headers:
            Cache-Control:
              schema:
                type: string
                example: private, max-age=86400
          content:
            image/*:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /members:
    get:
      tags: [members]
      summary: Directory of members who opted in
      description: |
        Lists webtrees users who have a portal profile with
        `visible_in_directory` set. A member's own entry is included.

        The `display_name` of an entry is portal data the member consented to
        publish, not GEDCOM data. The `individual` of an entry is GEDCOM data
        and is `null` whenever the caller may not see that record.
      operationId: listMembers
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - name: q
          in: query
          required: false
          description: Case-insensitive substring filter on the display name.
          schema:
            type: string
            maxLength: 100
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: per_page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
      responses:
        '200':
          description: A page of members
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberPage'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /members/{id}:
    get:
      tags: [members]
      summary: One member of the directory
      description: |
        Returns `404` for a member who is not visible in the directory, so
        that a non-listed account cannot be confirmed by probing.
      operationId: getMember
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - name: id
          in: path
          required: true
          description: |
            The portal member id — the surrogate primary key of
            `portal_member_profile`. Not a webtrees user id and not a GEDCOM
            XREF.
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: The member
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

components:

  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Secure-WT-ID
      description: |
        The webtrees session cookie, set by `POST /session`. Named
        `WT2_SESSION` when the site is not served over HTTPS.

  headers:
    CacheControl:
      description: Always `private, no-store`.
      required: true
      schema:
        type: string
        const: 'private, no-store'

  parameters:
    AcceptLanguage:
      name: Accept-Language
      in: header
      required: false
      description: |
        The language to render server-side strings in — fact labels, written
        dates, privacy placeholders. Standard content negotiation; an
        unavailable language is ignored rather than refused.
      example: de
      schema:
        type: string

    CsrfHeader:
      name: X-CSRF-TOKEN
      in: header
      required: true
      description: The token from `GET /csrf`.
      schema:
        type: string

  responses:
    BadRequest:
      description: The request body was malformed or a field was missing.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: bad_request
            message: Die Anfrage war unvollständig.

    Unauthorized:
      description: No valid session. The body carries no record data.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: unauthenticated
            message: Bitte melden Sie sich an.

    Forbidden:
      description: The CSRF token was missing or did not match the session.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: csrf_token_invalid
            message: Die Sitzung ist abgelaufen. Bitte erneut versuchen.

    NotFound:
      description: |
        No such record, or the authenticated user may not see it. The two
        cases are deliberately indistinguishable.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: not_found
            message: Dieser Eintrag wurde nicht gefunden.

  schemas:

    Error:
      type: object
      additionalProperties: false
      required: [error, message]
      properties:
        error:
          type: string
          description: A stable machine-readable code.
          enum:
            - bad_request
            - unauthenticated
            - csrf_token_invalid
            - proxy_secret_invalid
            - invalid_credentials
            - not_found
            - not_configured
            - no_linked_record
            - record_locked
            - change_pending
            - invalid_token
            - username_taken
            - email_taken
            - server_error
        message:
          type: string
          description: |
            A human-readable message in the server's language. The portal
            renders its own translated text keyed off `error` and uses this
            only for logging.
        reference:
          type: string
          description: |
            Present only on failures the module recorded — that is, on
            `server_error`, never on a refusal it meant to give. The member
            is shown it so they can quote it, and an administrator finds the
            matching row on the module's diagnosis screen.

    Health:
      type: object
      additionalProperties: false
      required: [status, version, schema_version]
      properties:
        status:
          type: string
          enum: [ok]
        version:
          type: string
          description: The module's version, so a deployment can prove itself.
        schema_version:
          type: integer
          description: The schema version this code expects.

    InvitationPreview:
      type: object
      additionalProperties: false
      required: [tree, invited_name, email, expires_at]
      properties:
        tree:
          $ref: '#/components/schemas/Tree'
        invited_name:
          type: string
          nullable: true
          description: |
            The name the invitation was issued for, as it read at that moment.
            A snapshot on the invitation, not a lookup — null when the
            invitation is not tied to anybody in the tree.
        email:
          type: string
          nullable: true
          description: Where the administrator sent it, used to prefill the form.
        expires_at:
          type: string
          format: date-time

    InvitationAcceptance:
      type: object
      additionalProperties: false
      required: [token, username, real_name, email, password]
      properties:
        token:
          type: string
          minLength: 1
        username:
          type: string
          minLength: 3
          maxLength: 32
          description: |
            No spaces and no `@`. webtrees signs people in with a query that
            matches a username *or* an email address, so a username shaped
            like an address could stand in front of somebody else's account.
        real_name:
          type: string
          maxLength: 64
        email:
          type: string
          format: email
          maxLength: 64
          description: |
            A contact address. It does not have to match the one the
            invitation was sent to — the credential is the token.
        password:
          type: string
          format: password
          minLength: 8

    CsrfToken:
      type: object
      additionalProperties: false
      required: [csrf_token]
      properties:
        csrf_token:
          type: string
          minLength: 1

    Credentials:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 255
          description: webtrees username or email address.
        password:
          type: string
          minLength: 1
          format: password

    Tree:
      type: object
      additionalProperties: false
      required: [name, title]
      properties:
        name:
          type: string
          description: The tree's internal name, used in webtrees URLs.
        title:
          type: string

    User:
      type: object
      additionalProperties: false
      required: [id, username, real_name, email, language, role]
      properties:
        id:
          type: integer
          description: The webtrees user id.
        username:
          type: string
        real_name:
          type: string
        email:
          type: string
          format: email
        language:
          type: string
          description: The user's webtrees language tag, e.g. `de` or `en-GB`.
        role:
          type: string
          description: |
            The user's role in the configured tree. The portal shows the
            "open in webtrees" affordances only to editors and above.
          enum: [visitor, member, editor, moderator, manager, administrator]

    MemberProfile:
      description: The portal's own record for a member, from `portal_member_profile`.
      type: object
      additionalProperties: false
      required: [id, visible_in_directory, display_name_override, consent_recorded_at]
      properties:
        id:
          type: integer
          description: Surrogate primary key. The member id used by `/members/{id}`.
        visible_in_directory:
          type: boolean
        display_name_override:
          type: [string, 'null']
        consent_recorded_at:
          type: [string, 'null']
          format: date-time

    Accepted:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          const: accepted

    MemberProfileUpdate:
      description: |
        Absent fields are left unchanged. This is a PATCH, not a replacement.
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        visible_in_directory:
          type: boolean
        display_name_override:
          type: [string, 'null']
          maxLength: 128

    IndividualUpdate:
      description: |
        The complete set of things a member may change about themselves.
        Absent fields are left unchanged; a field sent as `null` removes that
        fact from the record.

        Values are plain text. Anything resembling GEDCOM structure in a value
        is rejected rather than escaped — a newline in a value would otherwise
        let a member append arbitrary facts to their own record.
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        given_names:
          type: [string, 'null']
          maxLength: 120
        surname:
          type: [string, 'null']
          maxLength: 120
        birth_date:
          type: [string, 'null']
          maxLength: 60
          description: |
            A GEDCOM date, parsed by webtrees' own Date class — so `12 MAR
            1985`, `ABT 1985` and `BET 1980 AND 1985` are all valid. Rejected
            if webtrees cannot parse it.
        birth_place:
          type: [string, 'null']
          maxLength: 120
        occupation:
          type: [string, 'null']
          maxLength: 120
        address:
          type: [string, 'null']
          maxLength: 200
        email:
          type: [string, 'null']
          maxLength: 120
        phone:
          type: [string, 'null']
          maxLength: 60
        website:
          type: [string, 'null']
          maxLength: 200

    PendingIndividual:
      type: object
      additionalProperties: false
      required: [status, individual, pending_change]
      properties:
        status:
          type: string
          enum: [pending_approval, applied]
          description: |
            What actually happened, not what usually happens.

            `pending_approval` is the normal case and the one the whole design
            is built around: the edit is in webtrees' pending changes list and
            an editor decides.

            `applied` is what webtrees does when the *acting* user has the
            `auto_accept` preference — editors and administrators usually do,
            members do not. The change is already live and there is nothing to
            approve. The portal has to be able to say so: telling an
            administrator their change is under review, when it is not, sends
            them looking for it in a list it will never appear in.
        individual:
          oneOf:
            - $ref: '#/components/schemas/Individual'
            - type: 'null'
          description: The record as currently approved — not the proposed version.

    Me:
      type: object
      additionalProperties: false
      required: [user, profile, individual, tree, csrf_token]
      properties:
        user:
          $ref: '#/components/schemas/User'
        profile:
          oneOf:
            - $ref: '#/components/schemas/MemberProfile'
            - type: 'null'
          description: |
            `null` when no portal profile row exists yet for this webtrees
            user. The portal treats that as "not visible in the directory,
            no consent recorded".
        individual:
          oneOf:
            - $ref: '#/components/schemas/Individual'
            - type: 'null'
          description: |
            The member's own record. `null` when an administrator has not
            linked this webtrees account to an individual in the configured
            tree (the per-tree user setting `gedcomid`).
        tree:
          $ref: '#/components/schemas/Tree'
        csrf_token:
          type: string

    DateValue:
      type: object
      additionalProperties: false
      required: [display, gedcom, year]
      properties:
        display:
          type: string
          description: |
            Plain text, formatted by webtrees for the tree's calendar and
            date-format preferences.
        gedcom:
          type: string
          description: The raw GEDCOM date value, e.g. `ABT 1889`.
        year:
          type: [integer, 'null']
          description: Gregorian year, or `null` when the date has no usable year.

    Event:
      type: object
      additionalProperties: false
      required: [tag, label, value, date, place]
      properties:
        tag:
          type: string
          description: The GEDCOM tag path, e.g. `INDI:BIRT`.
        label:
          type: string
          description: webtrees' translated label for the tag.
        value:
          type: [string, 'null']
          description: The fact's own value, where it carries one (e.g. an occupation).
        date:
          oneOf:
            - $ref: '#/components/schemas/DateValue'
            - type: 'null'
        place:
          type: [string, 'null']

    IndividualRef:
      description: |
        A reference to an individual the caller is allowed to see. Individuals
        the caller may not see are omitted from the containing list entirely.
      type: object
      additionalProperties: false
      required: [xref, name, sex, is_deceased, lifespan, portrait]
      properties:
        xref:
          type: string
        name:
          type: string
          description: |
            Plain text. Where the record is visible but its name is not,
            this is webtrees' own placeholder for a private name.
        sex:
          type: string
          enum: [M, F, X, U]
        is_deceased:
          type: boolean
        lifespan:
          type: [string, 'null']
          description: e.g. `1889–1976`. `null` when neither year is visible.
        portrait:
          description: |
            The one picture that stands for this person, or `null`. webtrees'
            own choice — the first media object on the record with an image in
            it — so the portal and webtrees agree about which face belongs to a
            name.

            Carried on the *reference* shape, so a directory entry or a
            relative list can show a face without a request each.
          oneOf:
            - $ref: '#/components/schemas/Photo'
            - type: 'null'

    Reference:
      type: object
      additionalProperties: false
      required:
        - number
        - type
      properties:
        number:
          type: string
          description: The reference number itself, e.g. "4711".
          example: '4711'
        type:
          type: [string, 'null']
          description: |
            What kind of reference it is (`REFN:TYPE`), where the record says
            so — e.g. "SB" for this archive's own numbering.
          example: SB

    Photo:
      type: object
      additionalProperties: false
      required: [id, title, thumbnail_url, image_url]
      properties:
        id:
          type: string
          description: Identifies the file within its media record.
          example: 6f8a1c2e4b7d9013a5c6e8f0b2d4a6c8
        title:
          type: [string, 'null']
          example: Anna im Garten
        thumbnail_url:
          type: string
          description: |
            A square thumbnail, **relative to the portal's own origin**.

            Deliberately not webtrees' media URL. That points at the webtrees
            host, and the session cookie is scoped to the portal's origin, so
            the browser would arrive without a session and get webtrees'
            "forbidden" replacement image back. Every picture would be a grey
            box.
          example: /api/v1/media/M1/6f8a1c2e4b7d9013a5c6e8f0b2d4a6c8/thumbnail
        image_url:
          type: string
          description: The full-size file, same origin, same reasoning.
          example: /api/v1/media/M1/6f8a1c2e4b7d9013a5c6e8f0b2d4a6c8/image

    Ancestor:
      allOf:
        - $ref: '#/components/schemas/IndividualRef'
        - type: object
          required:
            - position
            - generation
          properties:
            position:
              type: integer
              minimum: 1
              description: |
                The Ahnentafel number. 1 is the root, 2n is a father and 2n+1
                a mother.

                Numbers are not contiguous: a person the member may not see is
                absent, and so is everyone above them. A missing number means
                "nothing to show here", never "somebody hidden lives here" —
                the two are indistinguishable by design, because a tree with a
                labelled hole in it is a tree that tells you what fills it.
              example: 5
            generation:
              type: integer
              minimum: 0
              description: 0 for the root, 1 for parents, and so on.
              example: 2

    AncestorPage:
      type: object
      additionalProperties: false
      required:
        - generations
        - people
      properties:
        generations:
          type: integer
          description: How many generations were actually walked, after clamping.
          example: 4
        people:
          type: array
          description: The visible ancestors, root first, in Ahnentafel order.
          items:
            $ref: '#/components/schemas/Ancestor'

    Individual:
      allOf:
        - $ref: '#/components/schemas/IndividualRef'
        - type: object
          additionalProperties: false
          required:
            - name_alternative
            - relationship
            - photos
            - references
            - birth
            - death
            - events
            - parents
            - siblings
            - spouses
            - children
            - pending_change
            - webtrees_url
          properties:
            name_alternative:
              type: [string, 'null']
              description: A name in an alternative character set, where one exists.
            relationship:
              type: [string, 'null']
              description: |
                How the authenticated member is related to this person, named
                by webtrees in the request's language — "Ihre Cousine", "your
                great-grandfather".

                `null` whenever there is nothing safe or useful to say: the
                member's account is not linked to a record, this *is* their
                record, no relationship was found within four steps, or — the
                one that matters — every path between them runs through
                someone the member may not see. A relationship name encodes
                the shape of the path that produced it, so naming one through
                a hidden person would disclose that they exist.
              example: Ihre Urgroßmutter
            photos:
              type: array
              description: |
                Every picture on the record this member may see, `portrait`
                included. A media record they may not see is absent — not a
                placeholder, not a count.
              items:
                $ref: '#/components/schemas/Photo'
            references:
              type: array
              description: |
                User reference numbers (`REFN`) on the record — the archive's
                own numbering, not webtrees'. Usually none or one. Empty when
                the record carries none, or when fact-level privacy hides
                them.

                Deliberately a field rather than an entry in `events`: it is
                bookkeeping, not something that happened to the person. It is
                never part of `name`.
              items:
                $ref: '#/components/schemas/Reference'
            birth:
              oneOf:
                - $ref: '#/components/schemas/Event'
                - type: 'null'
            death:
              oneOf:
                - $ref: '#/components/schemas/Event'
                - type: 'null'
            events:
              type: array
              description: |
                Visible facts, in webtrees' own order. Restricted to an
                allow-list of tags for Phase 1; see NOTES.md.
              items:
                $ref: '#/components/schemas/Event'
            parents:
              type: array
              items:
                $ref: '#/components/schemas/IndividualRef'
            siblings:
              type: array
              items:
                $ref: '#/components/schemas/IndividualRef'
            spouses:
              type: array
              items:
                $ref: '#/components/schemas/IndividualRef'
            children:
              type: array
              items:
                $ref: '#/components/schemas/IndividualRef'
            pending_change:
              type: boolean
              description: |
                True when this record has an edit waiting for an editor to
                approve it. The portal shows the member that their change was
                received but is not live yet.
            webtrees_url:
              type: string
              format: uri
              description: |
                Absolute URL of this record in webtrees. The portal links out
                here for charts, which it does not implement.

    MemberSummary:
      type: object
      additionalProperties: false
      required: [id, display_name, individual]
      properties:
        id:
          type: integer
          description: The portal member id.
        display_name:
          type: string
          description: |
            Portal data the member consented to publish — their
            `display_name_override` if set, otherwise their webtrees real
            name. Never taken from GEDCOM.
        individual:
          oneOf:
            - $ref: '#/components/schemas/IndividualRef'
            - type: 'null'
          description: |
            `null` when the member has no linked record, or when the caller
            may not see it.

    MemberDetail:
      allOf:
        - $ref: '#/components/schemas/MemberSummary'
        - type: object
          additionalProperties: false
          required: [individual_detail]
          properties:
            individual_detail:
              oneOf:
                - $ref: '#/components/schemas/Individual'
                - type: 'null'

    MemberPage:
      type: object
      additionalProperties: false
      required: [items, total, page, per_page]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/MemberSummary'
        total:
          type: integer
        page:
          type: integer
        per_page:
          type: integer

security:
  - sessionCookie: []
