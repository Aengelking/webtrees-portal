name: Deploy

# Uploads build artefacts to the webtrees host over SFTP.
#
# The module has no other deployment path — it has to be copied into
# modules_v4/ on the host — so that is what this deploys by default. The
# portal normally goes to Cloudflare Workers from the repository, but it can be
# uploaded here too for installations that serve the SPA from the same
# webspace as webtrees.
#
# Nothing is uploaded until the tests pass. This deploys code that reads a
# family's genealogy database, including living people's data; the privacy
# assertions are the reason to trust a release.
#
# The tests are split by what is being shipped. A module deployment runs the
# module's suite — the privacy assertions — and nothing else. The portal's
# build, unit tests and browser smoke path only run when the portal itself is
# being uploaded, which is what a push never does. That is most of the waiting
# gone from the common case without giving up the guard on what is shipped.
#
# The one exception is the `skip_tests` box on a manual run, for when the thing
# being debugged is the upload itself and waiting several minutes for a green
# suite before each attempt is dead time. It is deliberately awkward:
#
#   * only a hand-started run can set it — a push to main always runs the
#     tests, so nothing reaches the server untested by accident;
#   * it refuses to upload the portal, because the portal is built by the test
#     job and there is nothing to upload without it;
#   * the deploy job says loudly, in its own log, that it uploaded untested
#     code.
#
# Untick it again as soon as the upload works.

on:
  workflow_dispatch:
    inputs:
      target:
        description: What to upload
        type: choice
        required: true
        default: module
        options:
          - module
          - portal
          - both
      dry_run:
        description: Print what would be uploaded and contact nothing
        type: boolean
        required: false
        default: false
      skip_tests:
        description: "Skip the test suite (module only — for debugging the upload)"
        type: boolean
        required: false
        default: false

  push:
    branches:
      - main
    paths:
      - 'module/portal_api/**'

concurrency:
  # One deployment at a time. Two overlapping runs would fight over the
  # staging directory on the server.
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Split in two so that a module deployment does not wait for a portal it is
  # not shipping. The module's tests are the privacy assertions and run for
  # every deployment; the portal's build, unit tests and smoke path — the
  # slowest part of this workflow by a distance, mostly the browser — run only
  # when the portal is actually being uploaded.
  test-module:
    name: Test the module
    # `inputs` is null for a push, so a push always runs this.
    if: inputs.skip_tests != true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: ctype, curl, gd, iconv, intl, json, mbstring, pcre, pdo, pdo_sqlite, session, xml, zip
          coverage: none

      - name: Cache the webtrees checkout
        id: webtrees-cache
        uses: actions/cache@v6
        with:
          path: module/.webtrees
          key: webtrees-2.2.6-${{ runner.os }}-php8.3

      - name: Set up the test environment
        run: module/tools/setup-test-env.sh

      - name: Run the module tests
        working-directory: module
        run: .webtrees/vendor/bin/phpunit --no-coverage

  test-portal:
    name: Test the portal
    # A push deploys the module only, so this is for hand-started portal runs.
    if: inputs.skip_tests != true && (inputs.target == 'portal' || inputs.target == 'both')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: portal/package-lock.json

      - name: Install the portal's dependencies
        working-directory: portal
        run: npm ci

      - name: Typecheck and build the portal
        working-directory: portal
        run: npm run build

      - name: Run the portal's unit tests
        working-directory: portal
        run: npm test

      - name: Install Playwright's browser
        working-directory: portal
        run: npx playwright install --with-deps chromium

      - name: Run the smoke path
        working-directory: portal
        run: npm run test:e2e

      - name: Keep the Playwright report when the smoke path fails
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            portal/playwright-report
            portal/test-results
          retention-days: 7
          if-no-files-found: ignore

      - name: Keep the built portal
        uses: actions/upload-artifact@v7
        with:
          name: portal-dist
          path: portal/dist
          retention-days: 1

  deploy:
    name: Upload over SFTP
    needs: [test-module, test-portal]
    # always(), because a skipped test job would otherwise skip this one too —
    # and one of the two is skipped on most runs. The result checks are what
    # keep a *failed* test run from deploying; "skipped" is not "failed".
    if: >-
      always()
      && needs.test-module.result != 'failure' && needs.test-module.result != 'cancelled'
      && needs.test-portal.result != 'failure' && needs.test-portal.result != 'cancelled'
    runs-on: ubuntu-latest
    # A refused connection is retried after 30s, then 90s, then 270s — long
    # enough to outlast a host that is briefly turning this runner away. Two
    # sessions, so the worst case is around a quarter of an hour. This stops a
    # hung connection from sitting on a runner for the default six.
    timeout-minutes: 30
    # Add required reviewers to this environment in the repository settings if
    # you want a human to approve each deployment.
    environment: production
    steps:
      - uses: actions/checkout@v7

      - name: Say plainly that this is untested
        if: needs.test-module.result == 'skipped'
        run: |
          echo "::warning title=Tests skipped::Uploading code that has not been tested. This is only for debugging the upload itself — re-run without skip_tests before trusting the result."

      - name: Refuse to upload an unbuilt portal
        if: needs.test-portal.result != 'success' && (inputs.target == 'portal' || inputs.target == 'both')
        run: |
          echo "::error title=Nothing to upload::The portal is built by its test job, which did not run, so there is nothing to upload. Choose target=module, or run without skip_tests."
          exit 1

      - name: Install sshpass
        run: |
          sudo apt-get update -qq
          # openssh-client is already on the runner; named anyway so this step
          # says what the upload needs. sshpass is the only addition: ssh will
          # not read a password from anywhere but a terminal, so a
          # non-interactive password login needs it.
          sudo apt-get install -y -qq openssh-client sshpass

      - name: Upload the module
        if: github.event_name == 'push' || inputs.target == 'module' || inputs.target == 'both'
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_PORT: ${{ secrets.SFTP_PORT }}
          SFTP_USERNAME: ${{ secrets.SFTP_USERNAME }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          SFTP_KNOWN_HOSTS: ${{ secrets.SFTP_KNOWN_HOSTS }}
          SFTP_REMOTE_PATH: ${{ secrets.SFTP_MODULE_PATH }}
          # Optional repository variables; the script defaults to 4 attempts
          # and a 30-second first delay.
          SFTP_MAX_ATTEMPTS: ${{ vars.SFTP_MAX_ATTEMPTS }}
          SFTP_RETRY_DELAY: ${{ vars.SFTP_RETRY_DELAY }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: module/tools/deploy-sftp.sh module/portal_api

      - name: Download the built portal
        if: inputs.target == 'portal' || inputs.target == 'both'
        uses: actions/download-artifact@v8
        with:
          name: portal-dist
          path: portal/dist

      - name: Upload the portal
        if: inputs.target == 'portal' || inputs.target == 'both'
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_PORT: ${{ secrets.SFTP_PORT }}
          SFTP_USERNAME: ${{ secrets.SFTP_USERNAME }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          SFTP_KNOWN_HOSTS: ${{ secrets.SFTP_KNOWN_HOSTS }}
          SFTP_REMOTE_PATH: ${{ secrets.SFTP_PORTAL_PATH }}
          SFTP_MAX_ATTEMPTS: ${{ vars.SFTP_MAX_ATTEMPTS }}
          SFTP_RETRY_DELAY: ${{ vars.SFTP_RETRY_DELAY }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: module/tools/deploy-sftp.sh portal/dist

      # One request that proves the whole chain: the Cloudflare Worker, its
      # proxy secret, whatever URL form webtrees needs, PHP, webtrees'
      # bootstrap, the module's boot(), the database and the tree setting.
      #
      # It compares the version the endpoint reports against the version in
      # the checkout, which is the assertion that matters: an SFTP upload can
      # report success and leave the old files in place, and nothing else
      # here would notice. A mismatch is reported as a warning rather than a
      # failure, because a deployment that only bumps the portal legitimately
      # leaves the module's version alone.
      #
      # Skipped entirely when PORTAL_URL is not set as a repository variable.
      - name: Check the portal is answering
        if: vars.PORTAL_URL != '' && inputs.dry_run != true
        env:
          PORTAL_URL: ${{ vars.PORTAL_URL }}
        run: |
          set -u

          expected=$(grep -oP "CUSTOM_VERSION = '\K[^']+" module/portal_api/src/PortalApiModule.php)
          url="${PORTAL_URL%/}/api/v1/health"

          echo "==> ${url}"

          # Cloudflare and PHP-FPM both take a moment to pick up new files.
          # Five tries over roughly a minute, then give up and fail.
          for attempt in 1 2 3 4 5; do
            body=$(curl --silent --show-error --max-time 20 --write-out '\n%{http_code}' "$url" || true)
            status=$(printf '%s' "$body" | tail -n1)
            payload=$(printf '%s' "$body" | sed '$d')

            if [ "$status" = "200" ]; then
              echo "$payload"
              reported=$(printf '%s' "$payload" | grep -oP '"version"\s*:\s*"\K[^"]+' || true)

              if [ "$reported" != "$expected" ]; then
                echo "::warning title=Version mismatch::The portal reports module version '${reported:-unknown}'; this checkout is ${expected}. If this run only deployed the portal, that is expected."
              fi

              echo "The portal answered."
              exit 0
            fi

            echo "Attempt ${attempt}: HTTP ${status:-none}"
            printf '%s\n' "$payload" | head -c 500
            [ "$attempt" -lt 5 ] && sleep 15
          done

          echo "::error title=The portal is not answering::GET ${url} did not return 200 after five attempts. The upload finished, so this is the module, the proxy secret or the tree setting — the module's Diagnosis screen in the control panel says which."
          exit 1
