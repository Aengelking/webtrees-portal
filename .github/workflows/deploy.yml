name: Deploy

# Uploads build artefacts to the webtrees host over SFTP.
#
# The module has no other deployment path — it has to be copied into
# modules_v4/ on the host — so that is what this deploys by default. The
# portal normally goes to Cloudflare Workers from the repository, but it can be
# uploaded here too for installations that serve the SPA from the same
# webspace as webtrees.
#
# Nothing is uploaded until the tests pass. This deploys code that reads a
# family's genealogy database, including living people's data; the privacy
# assertions are the reason to trust a release.
#
# The one exception is the `skip_tests` box on a manual run, for when the thing
# being debugged is the upload itself and waiting several minutes for a green
# suite before each attempt is dead time. It is deliberately awkward:
#
#   * only a hand-started run can set it — a push to main always runs the
#     tests, so nothing reaches the server untested by accident;
#   * it refuses to upload the portal, because the portal is built by the test
#     job and there is nothing to upload without it;
#   * the deploy job says loudly, in its own log, that it uploaded untested
#     code.
#
# Untick it again as soon as the upload works.

on:
  workflow_dispatch:
    inputs:
      target:
        description: What to upload
        type: choice
        required: true
        default: module
        options:
          - module
          - portal
          - both
      dry_run:
        description: Print what would be uploaded and contact nothing
        type: boolean
        required: false
        default: false
      skip_tests:
        description: "Skip the test suite (module only — for debugging the upload)"
        type: boolean
        required: false
        default: false

  push:
    branches:
      - main
    paths:
      - 'module/portal_api/**'

concurrency:
  # One deployment at a time. Two overlapping runs would fight over the
  # staging directory on the server.
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    name: Test
    # `inputs` is null for a push, so a push always runs this.
    if: inputs.skip_tests != true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: ctype, curl, gd, iconv, intl, json, mbstring, pcre, pdo, pdo_sqlite, session, xml, zip
          coverage: none

      - name: Cache the webtrees checkout
        id: webtrees-cache
        uses: actions/cache@v6
        with:
          path: module/.webtrees
          key: webtrees-2.2.1-${{ runner.os }}-php8.3

      - name: Set up the test environment
        run: module/tools/setup-test-env.sh

      - name: Run the module tests
        working-directory: module
        run: .webtrees/vendor/bin/phpunit --no-coverage

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: portal/package-lock.json

      - name: Install the portal's dependencies
        working-directory: portal
        run: npm ci

      - name: Typecheck and build the portal
        working-directory: portal
        run: npm run build

      - name: Run the portal's unit tests
        working-directory: portal
        run: npm test

      - name: Install Playwright's browser
        working-directory: portal
        run: npx playwright install --with-deps chromium

      - name: Run the smoke path
        working-directory: portal
        run: npm run test:e2e

      - name: Keep the Playwright report when the smoke path fails
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            portal/playwright-report
            portal/test-results
          retention-days: 7
          if-no-files-found: ignore

      - name: Keep the built portal
        if: inputs.target == 'portal' || inputs.target == 'both'
        uses: actions/upload-artifact@v7
        with:
          name: portal-dist
          path: portal/dist
          retention-days: 1

  deploy:
    name: Upload over SFTP
    needs: test
    # always(), because a skipped `test` job would otherwise skip this one too.
    # The result check is what keeps a *failed* test run from deploying.
    if: always() && needs.test.result != 'failure' && needs.test.result != 'cancelled'
    runs-on: ubuntu-latest
    # A refused connection is retried after 30s, then 90s, then 270s — long
    # enough to outlast a host that is briefly turning this runner away. Two
    # sessions, so the worst case is around a quarter of an hour. This stops a
    # hung connection from sitting on a runner for the default six.
    timeout-minutes: 30
    # Add required reviewers to this environment in the repository settings if
    # you want a human to approve each deployment.
    environment: production
    steps:
      - uses: actions/checkout@v7

      - name: Say plainly that this is untested
        if: needs.test.result == 'skipped'
        run: |
          echo "::warning title=Tests skipped::Uploading code that has not been tested. This is only for debugging the upload itself — re-run without skip_tests before trusting the result."

      - name: Refuse to upload an unbuilt portal
        if: needs.test.result == 'skipped' && inputs.target != 'module'
        run: |
          echo "::error title=Nothing to upload::The portal is built by the test job, so skip_tests leaves nothing to upload. Choose target=module, or run with the tests."
          exit 1

      - name: Install sshpass
        run: |
          sudo apt-get update -qq
          # openssh-client is already on the runner; named anyway so this step
          # says what the upload needs. sshpass is the only addition: ssh will
          # not read a password from anywhere but a terminal, so a
          # non-interactive password login needs it.
          sudo apt-get install -y -qq openssh-client sshpass

      - name: Upload the module
        if: github.event_name == 'push' || inputs.target == 'module' || inputs.target == 'both'
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_PORT: ${{ secrets.SFTP_PORT }}
          SFTP_USERNAME: ${{ secrets.SFTP_USERNAME }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          SFTP_KNOWN_HOSTS: ${{ secrets.SFTP_KNOWN_HOSTS }}
          SFTP_REMOTE_PATH: ${{ secrets.SFTP_MODULE_PATH }}
          # Optional repository variables; the script defaults to 4 attempts
          # and a 30-second first delay.
          SFTP_MAX_ATTEMPTS: ${{ vars.SFTP_MAX_ATTEMPTS }}
          SFTP_RETRY_DELAY: ${{ vars.SFTP_RETRY_DELAY }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: module/tools/deploy-sftp.sh module/portal_api

      - name: Download the built portal
        if: inputs.target == 'portal' || inputs.target == 'both'
        uses: actions/download-artifact@v8
        with:
          name: portal-dist
          path: portal/dist

      - name: Upload the portal
        if: inputs.target == 'portal' || inputs.target == 'both'
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_PORT: ${{ secrets.SFTP_PORT }}
          SFTP_USERNAME: ${{ secrets.SFTP_USERNAME }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          SFTP_KNOWN_HOSTS: ${{ secrets.SFTP_KNOWN_HOSTS }}
          SFTP_REMOTE_PATH: ${{ secrets.SFTP_PORTAL_PATH }}
          SFTP_MAX_ATTEMPTS: ${{ vars.SFTP_MAX_ATTEMPTS }}
          SFTP_RETRY_DELAY: ${{ vars.SFTP_RETRY_DELAY }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: module/tools/deploy-sftp.sh portal/dist
