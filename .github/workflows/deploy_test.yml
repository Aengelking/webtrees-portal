name: Deploy module via SFTP

# Uploads the translate-notes module to the webtrees server over SFTP whenever
# main changes. (The host - Strato - only offers SFTP on port 22, not FTP/FTPS.)
#
# Configure these repository secrets first
# (Settings -> Secrets and variables -> Actions):
#
#   FTP_SERVER      - host name, e.g. ssh.strato.de or your domain
#   FTP_USERNAME    - SSH/SFTP user (on Strato this is usually the same as the
#                     FTP user; check Strato control panel -> "SSH/SFTP access")
#   FTP_PASSWORD    - SSH/SFTP password
#   FTP_SERVER_DIR  - absolute target path on the server, e.g.
#                     /modules_v4/translate-notes/  (or the full path your
#                     hosting uses, ending with the module folder name)
#
# If your host needs a key instead of a password, swap `password` for
# `ssh_private_key` and store the key in an SSH_PRIVATE_KEY secret.

# Hand-started only. The `push:` trigger is gone rather than emptied: an empty
# branch list reads as "matches nothing", but that is a property of the filter
# rather than something the docs promise, and this workflow writes straight
# into the live module directory. Removing the key says it outright.
#
# .github/workflows/deploy.yml is the one that deploys. This is kept as the
# reference that identified lftp as the cause of the upload failures — it is
# the shape that works on this host, minus the host key check, the atomic
# swap and the tests.
on:
  workflow_dispatch:

concurrency:
  group: sftp-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to modules_v4
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          server: ${{ secrets.SFTP_HOST }}
          port: 22
          username: ${{ secrets.SFTP_USERNAME }}
          password: ${{ secrets.SFTP_PASSWORD }}
          # Upload the contents of the module folder into the target directory.
          local_path: './module/portal_api/*'
          remote_path: ${{ secrets.SFTP_MODULE_PATH }}
          sftp_only: true
