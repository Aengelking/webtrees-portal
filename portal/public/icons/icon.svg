<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Familienportal">
  <!--
    The source of truth for every icon in this directory. The PNGs beside it
    are rasterised from this file and from icon-maskable.svg; see
    tools/icons.md before editing one of them by hand.

